# packages/device_batteries.yaml
#
# Device Battery Monitoring Package
#
# Features:
# - Enhanced battery monitoring with proactive alerts
# - Canonical battery inventory consumed by summary sensors and alerts
# - Maintenance scheduling and tracking

homeassistant:
  customize:
    package.node_anchors:
      critical_battery_threshold: &critical_threshold 15
      warning_battery_threshold: &warning_threshold 30
      low_battery_threshold: &low_threshold 5

input_boolean:
  device_health_monitoring_enabled:
    name: "Device Health Monitoring"
    icon: mdi:heart-pulse
    initial: true

  device_health_proactive_alerts:
    name: "Proactive Battery Alerts"
    icon: mdi:battery-alert
    initial: true

  device_health_critical_alert_sent:
    name: "Critical Battery Alert Status"
    icon: mdi:battery-10
    initial: false

input_number:
  device_health_critical_threshold:
    name: "Critical Battery Threshold"
    min: 5
    max: 75
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-20
    initial: *critical_threshold

  device_health_warning_threshold:
    name: "Warning Battery Threshold"
    min: 10
    max: 50
    step: 5
    unit_of_measurement: "%"
    icon: mdi:battery-30
    initial: *warning_threshold

  device_health_low_threshold:
    name: "Low Battery Threshold"
    min: 1
    max: 10
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-alert-variant-outline
    initial: *low_threshold

template:
  - sensor:
      # Canonical battery inventory. Downstream battery summaries, problem
      # sensors, and alert variables consume these attributes instead of
      # re-scanning every entity independently.
      - name: "Real-time Battery Levels"
        unique_id: realtime_battery_levels
        state: >
          {% set ns = namespace(count=0) %}
          {% for entity in states if entity.attributes.battery_level is defined %}
            {% set level = entity.attributes.battery_level | float(-1) | int %}
            {% if level >= 0 and not entity.entity_id.startswith('sensor.device_health_') and entity.entity_id != 'sensor.real_time_battery_levels' %}
              {% set ns.count = ns.count + 1 %}
            {% endif %}
          {% endfor %}
          {% for entity in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
            {% if entity.state | string | regex_match('^[0-9.]+$') %}
              {% set level = entity.state | int %}
              {% if 0 <= level <= 100 %}
                {% if not entity.entity_id.startswith('sensor.device_health_') and
                      not entity.entity_id.startswith('sensor.battery_') and
                      entity.entity_id != 'sensor.real_time_battery_levels' %}
                  {% set ns.count = ns.count + 1 %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.count }}
        unit_of_measurement: "devices"
        attributes:
          critical_count: >
            {% set threshold = states('input_number.device_health_critical_threshold') | int(15) %}
            {% set ns = namespace(count=0) %}
            {% for entity in states if entity.attributes.battery_level is defined %}
              {% set level = entity.attributes.battery_level | float(-1) | int %}
              {% if 0 <= level <= threshold and not entity.entity_id.startswith('sensor.device_health_') and entity.entity_id != 'sensor.real_time_battery_levels' %}
                {% set ns.count = ns.count + 1 %}
              {% endif %}
            {% endfor %}
            {% for entity in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
              {% if entity.state | string | regex_match('^[0-9.]+$') %}
                {% set level = entity.state | int %}
                {% if 0 <= level <= threshold and not entity.entity_id.startswith('sensor.device_health_') and not entity.entity_id.startswith('sensor.battery_') and entity.entity_id != 'sensor.real_time_battery_levels' %}
                  {% set ns.count = ns.count + 1 %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.count }}

          warning_count: >
            {% set critical_threshold = states('input_number.device_health_critical_threshold') | int(15) %}
            {% set warning_threshold = states('input_number.device_health_warning_threshold') | int(30) %}
            {% set ns = namespace(count=0) %}
            {% for entity in states if entity.attributes.battery_level is defined %}
              {% set level = entity.attributes.battery_level | float(-1) | int %}
              {% if critical_threshold < level <= warning_threshold and not entity.entity_id.startswith('sensor.device_health_') and entity.entity_id != 'sensor.real_time_battery_levels' %}
                {% set ns.count = ns.count + 1 %}
              {% endif %}
            {% endfor %}
            {% for entity in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
              {% if entity.state | string | regex_match('^[0-9.]+$') %}
                {% set level = entity.state | int %}
                {% if critical_threshold < level <= warning_threshold and not entity.entity_id.startswith('sensor.device_health_') and not entity.entity_id.startswith('sensor.battery_') and entity.entity_id != 'sensor.real_time_battery_levels' %}
                  {% set ns.count = ns.count + 1 %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.count }}

          low_count: >
            {% set threshold = states('input_number.device_health_low_threshold') | int(5) %}
            {% set ns = namespace(count=0) %}
            {% for entity in states if entity.attributes.battery_level is defined %}
              {% set level = entity.attributes.battery_level | float(-1) | int %}
              {% if 0 <= level <= threshold and not entity.entity_id.startswith('sensor.device_health_') and entity.entity_id != 'sensor.real_time_battery_levels' %}
                {% set ns.count = ns.count + 1 %}
              {% endif %}
            {% endfor %}
            {% for entity in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
              {% if entity.state | string | regex_match('^[0-9.]+$') %}
                {% set level = entity.state | int %}
                {% if 0 <= level <= threshold and not entity.entity_id.startswith('sensor.device_health_') and not entity.entity_id.startswith('sensor.battery_') and entity.entity_id != 'sensor.real_time_battery_levels' %}
                  {% set ns.count = ns.count + 1 %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.count }}

          critical_devices: >
            {% set threshold = states('input_number.device_health_critical_threshold') | int(15) %}
            {% set ns = namespace(devices=[]) %}
            {% for entity in states if entity.attributes.battery_level is defined %}
              {% set level = entity.attributes.battery_level | float(-1) | int %}
              {% if 0 <= level <= threshold and not entity.entity_id.startswith('sensor.device_health_') and entity.entity_id != 'sensor.real_time_battery_levels' %}
                {% set ns.devices = ns.devices + [(entity.name or entity.entity_id) ~ ' (' ~ level ~ '%)'] %}
              {% endif %}
            {% endfor %}
            {% for entity in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
              {% if entity.state | string | regex_match('^[0-9.]+$') %}
                {% set level = entity.state | int %}
                {% if 0 <= level <= threshold and not entity.entity_id.startswith('sensor.device_health_') and not entity.entity_id.startswith('sensor.battery_') and entity.entity_id != 'sensor.real_time_battery_levels' %}
                  {% set ns.devices = ns.devices + [(entity.name or entity.entity_id) ~ ' (' ~ level ~ '%)'] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.devices | join(', ') if ns.devices else 'None' }}

          low_devices: >
            {% set threshold = states('input_number.device_health_low_threshold') | int(5) %}
            {% set ns = namespace(devices=[]) %}
            {% for entity in states if entity.attributes.battery_level is defined %}
              {% set level = entity.attributes.battery_level | float(-1) | int %}
              {% if 0 <= level <= threshold and not entity.entity_id.startswith('sensor.device_health_') and entity.entity_id != 'sensor.real_time_battery_levels' %}
                {% set ns.devices = ns.devices + [(entity.name or entity.entity_id) ~ ' (' ~ level ~ '%)'] %}
              {% endif %}
            {% endfor %}
            {% for entity in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
              {% if entity.state | string | regex_match('^[0-9.]+$') %}
                {% set level = entity.state | int %}
                {% if 0 <= level <= threshold and not entity.entity_id.startswith('sensor.device_health_') and not entity.entity_id.startswith('sensor.battery_') and entity.entity_id != 'sensor.real_time_battery_levels' %}
                  {% set ns.devices = ns.devices + [(entity.name or entity.entity_id) ~ ' (' ~ level ~ '%)'] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.devices | join(', ') if ns.devices else 'None' }}

          lowest_battery: >
            {% set ns = namespace(lowest=999, name='') %}
            {% for entity in states if entity.attributes.battery_level is defined %}
              {% set level = entity.attributes.battery_level | float(-1) | int %}
              {% if 0 <= level <= 100 and not entity.entity_id.startswith('sensor.device_health_') and entity.entity_id != 'sensor.real_time_battery_levels' %}
                {% if level < ns.lowest %}
                  {% set ns.lowest = level %}
                  {% set ns.name = entity.name or entity.entity_id %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% for entity in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
              {% if entity.state | string | regex_match('^[0-9.]+$') %}
                {% set level = entity.state | int %}
                {% if 0 <= level <= 100 and not entity.entity_id.startswith('sensor.device_health_') and not entity.entity_id.startswith('sensor.battery_') and entity.entity_id != 'sensor.real_time_battery_levels' %}
                  {% if level < ns.lowest %}
                    {% set ns.lowest = level %}
                    {% set ns.name = entity.name or entity.entity_id %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% if ns.name %}
              {{ ns.name }}: {{ ns.lowest }}%
            {% else %}
              No batteries found
            {% endif %}

          lowest_level: >
            {% set threshold = states('input_number.device_health_critical_threshold') | int(15) %}
            {% set ns = namespace(lowest=101) %}
            {% for entity in states if entity.attributes.battery_level is defined %}
              {% set level = entity.attributes.battery_level | float(-1) | int %}
              {% if 0 <= level <= threshold and level < ns.lowest and not entity.entity_id.startswith('sensor.device_health_') and entity.entity_id != 'sensor.real_time_battery_levels' %}
                {% set ns.lowest = level %}
              {% endif %}
            {% endfor %}
            {% for entity in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
              {% if entity.state | string | regex_match('^[0-9.]+$') %}
                {% set level = entity.state | int %}
                {% if 0 <= level <= threshold and level < ns.lowest and not entity.entity_id.startswith('sensor.device_health_') and not entity.entity_id.startswith('sensor.battery_') and entity.entity_id != 'sensor.real_time_battery_levels' %}
                  {% set ns.lowest = level %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.lowest if ns.lowest <= threshold else 'None' }}

      - name: "Device Health Battery Summary"
        unique_id: device_health_battery_summary
        state: "{{ states('sensor.real_time_battery_levels') | int(0) }}"
        attributes:
          total_batteries: "{{ states('sensor.real_time_battery_levels') | int(0) }}"
          critical_count: "{{ state_attr('sensor.real_time_battery_levels', 'critical_count') | int(0) }}"
          warning_count: "{{ state_attr('sensor.real_time_battery_levels', 'warning_count') | int(0) }}"
          lowest_battery: "{{ state_attr('sensor.real_time_battery_levels', 'lowest_battery') }}"
          charging_devices: "None"

      - name: "Device Health Critical Devices"
        unique_id: device_health_critical_devices
        state: "{{ state_attr('sensor.real_time_battery_levels', 'critical_count') | int(0) }}"
        attributes:
          critical_threshold: >
            {{ states('input_number.device_health_critical_threshold') | int(15) }}
          devices: "{{ state_attr('sensor.real_time_battery_levels', 'critical_devices') }}"
          lowest_level: "{{ state_attr('sensor.real_time_battery_levels', 'lowest_level') }}"
          domains_affected: "See devices attribute"

  - binary_sensor:
      - name: "Device Health Has Critical Batteries"
        unique_id: device_health_has_critical_batteries
        state: >
          {{ states('sensor.device_health_critical_devices') | int > 0 }}
        device_class: problem

      - name: "Device Health Has Low Batteries"
        unique_id: device_health_has_low_batteries
        state: >
          {{ state_attr('sensor.real_time_battery_levels', 'low_count') | int(0) > 0 }}
        device_class: problem

automation:
  - alias: "device_health_critical_battery_alert"
    id: "device_health_critical_battery_alert"
    description: "Alert when batteries reach critical levels (15% default)"
    trigger:
      - platform: state
        entity_id: binary_sensor.device_health_has_critical_batteries
        to: "on"
        for:
          minutes: 5 # Wait 5 minutes to avoid false alarms
    condition:
      - condition: state
        entity_id: input_boolean.device_health_monitoring_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.device_health_proactive_alerts
        state: "on"
      - condition: state
        entity_id: input_boolean.device_health_critical_alert_sent
        state: "off"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.device_health_critical_alert_sent

      - variables:
          critical_devices: "{{ state_attr('sensor.device_health_critical_devices', 'devices') }}"
          device_count: "{{ states('sensor.device_health_critical_devices') | int(0) }}"
          device_names: "{{ critical_devices }}"
          lowest_level: "{{ state_attr('sensor.device_health_critical_devices', 'lowest_level') }}"

      - service: notify.all_mobile_devices
        data:
          title: "Critical Battery Alert"
          message: >
            {{ device_count }} device{{ 's' if device_count > 1 else '' }}
            ha{{ 's' if device_count == 1 else 've' }} critical battery levels.
            Lowest: {{ lowest_level }}%. Devices: {{ device_names }}
          data:
            tag: "device-health-critical"
            priority: "high"
            ttl: 0
            actions:
              - action: "device_health_view_details"
                title: "View Details"
              - action: "device_health_snooze"
                title: "Snooze 2hrs"
              - action: "device_health_dismiss"
                title: "Dismiss"

  - alias: "device_health_low_battery_alert"
    id: "device_health_low_battery_alert"
    description: "Urgent alert when batteries reach very low levels (5% default)"
    trigger:
      - platform: state
        entity_id: binary_sensor.device_health_has_low_batteries
        to: "on"
    condition:
      - condition: state
        entity_id: input_boolean.device_health_monitoring_enabled
        state: "on"
    action:
      - variables:
          low_threshold: "{{ states('input_number.device_health_low_threshold') | int }}"
          low_devices: "{{ state_attr('sensor.real_time_battery_levels', 'low_devices') }}"
          device_count: "{{ state_attr('sensor.real_time_battery_levels', 'low_count') | int(0) }}"
          device_names: "{{ low_devices }}"

      - service: notify.all_mobile_devices
        data:
          title: "🚨 URGENT: Battery Nearly Dead"
          message: >
            {{ device_count }} device{{ 's' if device_count > 1 else '' }}
            at critically low battery (≤{{ low_threshold }}%).
            Replace immediately: {{ device_names }}
          data:
            tag: "device-health-urgent"
            priority: "high"
            ttl: 0
            critical: true

  - alias: "device_health_alert_reset"
    id: "device_health_alert_reset"
    description: "Reset alert flags when batteries are replaced/charged"
    trigger:
      - platform: state
        entity_id: binary_sensor.device_health_has_critical_batteries
        to: "off"
        for:
          minutes: 10
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.device_health_critical_alert_sent

  - alias: "device_health_notification_actions"
    id: "device_health_notification_actions"
    description: "Handle device health notification actions"
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: device_health_view_details
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: device_health_snooze
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: device_health_dismiss
    action:
      - choose:
          # View details action (placeholder for dashboard link)
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.action == 'device_health_view_details' }}"
            sequence:
              - service: persistent_notification.create
                data:
                  title: "Device Health Details"
                  message: >
                    Critical batteries: {{ state_attr('sensor.device_health_critical_devices', 'devices') | length }}
                    Total batteries monitored: {{ states('sensor.device_health_battery_summary') }}

                    Details: {{ state_attr('sensor.device_health_critical_devices', 'devices') }}
                  notification_id: device_health_details

          # Snooze action
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.action == 'device_health_snooze' }}"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.device_health_critical_alert_sent
              - delay:
                  hours: 2
              # Re-check after snooze
              - if:
                  - condition: state
                    entity_id: binary_sensor.device_health_has_critical_batteries
                    state: "on"
                then:
                  - service: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.device_health_critical_alert_sent

          # Dismiss action
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.action == 'device_health_dismiss' }}"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.device_health_critical_alert_sent
