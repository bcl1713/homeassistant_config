# packages/climate_occupancy.yaml
#
# Presence-aware climate behavior: away targets, return-home schedule resume,
# and generic pre-arrival recovery from person/proximity abstractions.

input_number:
  climate_precool_arrival_distance_ft:
    name: Climate Pre-arrival Distance
    min: 1000
    max: 60000
    step: 500
    unit_of_measurement: ft
    icon: mdi:map-marker-distance
    initial: 30000
  climate_precool_arrival_signal_max_age:
    name: Climate Pre-arrival Signal Max Age
    min: 5
    max: 60
    step: 5
    unit_of_measurement: min
    icon: mdi:timer-alert-outline
    initial: 20
input_boolean:
  climate_pre_arrival_recovery_active:
    name: Climate Pre-arrival Recovery Active
    icon: mdi:home-import-outline
template:
  - trigger:
      - platform: homeassistant
        event: start
        id: ha_start
      - platform: state
        entity_id:
          - person.brian
          - person.hester
          - sensor.home_brian_distance
          - sensor.home_brian_direction_of_travel
          - sensor.home_hester_distance
          - sensor.home_hester_direction_of_travel
          - input_number.climate_precool_arrival_distance_ft
          - input_number.climate_precool_arrival_signal_max_age
        id: prearrival_input_changed
      - platform: time_pattern
        minutes: "/1"
        id: prearrival_signal_age_tick
    binary_sensor:
      - name: Climate Pre-arrival Expected
        unique_id: climate_pre_arrival_expected
        icon: mdi:home-import-outline
        availability: |
          {{ states('input_number.climate_precool_arrival_distance_ft') not in ['unknown', 'unavailable', '', none]
             and states('input_number.climate_precool_arrival_signal_max_age') not in ['unknown', 'unavailable', '', none] }}
        state: |
          {#
            Pre-arrival uses person-level Home Assistant abstractions plus
            proximity sensors, not raw tracker entities.
            To add another climate pre-arrival person, add one entry to this
            map with that person entity and its Home proximity distance/direction
            sensors.
          #} {% set tracked = {
            'person.brian': {
              'name': 'Brian',
              'distance': 'sensor.home_brian_distance',
              'direction': 'sensor.home_brian_direction_of_travel'
            },
            'person.hester': {
              'name': 'Hester',
              'distance': 'sensor.home_hester_distance',
              'direction': 'sensor.home_hester_direction_of_travel'
            }
          } %} {% set max_distance = states('input_number.climate_precool_arrival_distance_ft') | float(30000) %} {% set max_age = states('input_number.climate_precool_arrival_signal_max_age') | float(20) * 60 %} {% set now_ts = as_timestamp(now()) %} {% set ns = namespace(expected=false) %} {% for person, signals in tracked.items() %}
            {% set distance_state = states(signals.distance) %}
            {% set distance = distance_state | float(none) %}
            {% set direction = states(signals.direction) %}
            {% set person_state = states(person) %}
            {% set distance_obj = states[signals.distance] if signals.distance in states else none %}
            {% set distance_age = now_ts - as_timestamp(distance_obj.last_updated, 0) if distance_obj is not none else max_age + 1 %}
            {% if person_state != 'home'
                  and distance is not none
                  and distance <= max_distance
                  and direction == 'towards'
                  and distance_age <= max_age %}
              {% set ns.expected = true %}
            {% endif %}
          {% endfor %} {{ ns.expected }}
        attributes:
          eligible_people: Brian, Hester
          source_pattern: person entity plus Home proximity distance/direction sensors
          max_distance_ft: "{{ states('input_number.climate_precool_arrival_distance_ft') | float(30000)
            }}"
          max_signal_age_min: "{{ states('input_number.climate_precool_arrival_signal_max_age') | float(20)
            }}"
          expected_people: |
            {% set tracked = {
              'person.brian': {
                'name': 'Brian',
                'distance': 'sensor.home_brian_distance',
                'direction': 'sensor.home_brian_direction_of_travel'
              },
              'person.hester': {
                'name': 'Hester',
                'distance': 'sensor.home_hester_distance',
                'direction': 'sensor.home_hester_direction_of_travel'
              }
            } %} {% set max_distance = states('input_number.climate_precool_arrival_distance_ft') | float(30000) %} {% set max_age = states('input_number.climate_precool_arrival_signal_max_age') | float(20) * 60 %} {% set now_ts = as_timestamp(now()) %} {% set ns = namespace(names=[]) %} {% for person, signals in tracked.items() %}
              {% set distance = states(signals.distance) | float(none) %}
              {% set direction = states(signals.direction) %}
              {% set distance_obj = states[signals.distance] if signals.distance in states else none %}
              {% set distance_age = now_ts - as_timestamp(distance_obj.last_updated, 0) if distance_obj is not none else max_age + 1 %}
              {% if states(person) != 'home'
                    and distance is not none
                    and distance <= max_distance
                    and direction == 'towards'
                    and distance_age <= max_age %}
                {% set ns.names = ns.names + [signals.name] %}
              {% endif %}
            {% endfor %} {{ ns.names | join(', ') if ns.names else 'none' }}
          reason: |
            Requires an eligible person not already home, current proximity direction of 'towards', and fresh distance below the configured threshold. Direction state is not age-gated because the proximity integration may keep reporting the same direction while only the distance state changes.
automation:
  - alias: climate_pre_arrival_recovery_apply
    id: climate_pre_arrival_recovery_apply
    description: |
      Restore normal daytime occupied climate targets before an eligible resident arrives, with extreme heat as an optional cooling enhancement.
    trigger:
      - platform: homeassistant
        event: start
        id: ha_start
      - platform: state
        entity_id: binary_sensor.climate_pre_arrival_expected
        to: "on"
        for:
          minutes: 2
        id: prearrival_expected
      - platform: time_pattern
        minutes: "/5"
        id: prearrival_safety_tick
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.climate_pre_arrival_recovery_active
        state: "off"
      - condition: state
        entity_id: binary_sensor.climate_pre_arrival_expected
        state: "on"
      - condition: numeric_state
        entity_id: zone.home
        below: 1
      - condition: state
        entity_id: input_boolean.mode_guest
        state: "off"
      - condition: time
        after: "09:00:00"
        before: "21:00:00"
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.climate_extreme_heat_overlay_enabled
                state: "on"
              - condition: state
                entity_id: binary_sensor.climate_extreme_heat_day
                state: "on"
              - condition: time
                after: "12:59:00"
                before: "18:00:00"
            sequence:
              - service: climate.set_temperature
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  target_temp_high: |
                    {% set day = states('input_number.climate_cool_day') | float %} {% set offset = states('input_number.climate_extreme_heat_precool_offset') | float(1) %} {{ [day - offset, 65] | max }}
                  target_temp_low: |
                    {{ states('input_number.climate_heat_day') | float }}
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.climate_extreme_heat_precool_active
        default:
          - service: climate.set_temperature
            target:
              entity_id: climate.dining_room_thermostat
            data:
              target_temp_high: |
                {{ states('input_number.climate_cool_day') | float }}
              target_temp_low: |
                {{ states('input_number.climate_heat_day') | float }}
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.climate_pre_arrival_recovery_active
    mode: single
  - alias: climate_pre_arrival_recovery_restore
    id: climate_pre_arrival_recovery_restore
    description: |
      Clear pre-arrival recovery on arrival or revert to away targets if the inbound signal clears while nobody is home.
    trigger:
      - platform: state
        entity_id: binary_sensor.climate_pre_arrival_expected
        to: "off"
        for:
          minutes: 10
        id: prearrival_cleared
      - platform: numeric_state
        entity_id: zone.home
        above: 0
        id: arrived_home
      - platform: state
        entity_id: input_boolean.climate_automation_enabled
        to: "off"
        id: climate_disabled
      - platform: state
        entity_id: input_boolean.mode_guest
        to: "on"
        id: guest_mode_enabled
    condition:
      - condition: state
        entity_id: input_boolean.climate_pre_arrival_recovery_active
        state: "on"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.climate_pre_arrival_recovery_active
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'prearrival_cleared' }}"
              - condition: state
                entity_id: input_boolean.climate_automation_enabled
                state: "on"
              - condition: numeric_state
                entity_id: zone.home
                below: 1
              - condition: state
                entity_id: input_boolean.mode_guest
                state: "off"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.climate_extreme_heat_precool_active
              - service: climate.set_hvac_mode
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  hvac_mode: heat_cool
              - service: climate.set_temperature
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  target_temp_high: |
                    {{ states('input_number.climate_cool_away') | float }}
                  target_temp_low: |
                    {{ states('input_number.climate_heat_away') | float }}
    mode: single
  - alias: climate_away_mode_activate
    id: climate_away_mode_activate
    description: Activate energy-saving temps when everyone leaves
    trigger:
      - platform: numeric_state
        entity_id: zone.home
        below: 1
        for:
          minutes: 5
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.mode_guest
        state: "off"
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      - service: climate.set_temperature
        target:
          entity_id: climate.dining_room_thermostat
        data:
          target_temp_high: |
            {{ states('input_number.climate_cool_away') | float }}
          target_temp_low: |
            {{ states('input_number.climate_heat_away') | float }}
  - alias: climate_away_mode_deactivate
    id: climate_away_mode_deactivate
    description: Resume schedule when someone returns home
    trigger:
      - platform: numeric_state
        entity_id: zone.home
        above: 0
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      - choose:
          - conditions:
              - condition: or
                conditions:
                  - condition: and
                    conditions:
                      - condition: time
                        after: "05:00:00"
                        before: "09:00:00"
                      - condition: time
                        weekday:
                          - mon
                          - tue
                          - wed
                          - thu
                          - fri
                  - condition: and
                    conditions:
                      - condition: time
                        after: "07:00:00"
                        before: "09:00:00"
                      - condition: time
                        weekday:
                          - sat
                          - sun
            sequence:
              - service: climate.set_temperature
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  target_temp_high: |
                    {{ states('input_number.climate_cool_morning') | float }}
                  target_temp_low: |
                    {{ states('input_number.climate_heat_morning') | float }}
          - conditions:
              - condition: state
                entity_id: input_boolean.climate_extreme_heat_overlay_enabled
                state: "on"
              - condition: state
                entity_id: binary_sensor.climate_extreme_heat_day
                state: "on"
              - condition: time
                after: "12:59:00"
                before: "18:00:00"
            sequence:
              - service: climate.set_temperature
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  target_temp_high: |
                    {% set day = states('input_number.climate_cool_day') | float %} {% set offset = states('input_number.climate_extreme_heat_precool_offset') | float(1) %} {{ [day - offset, 65] | max }}
                  target_temp_low: |
                    {{ states('input_number.climate_heat_day') | float }}
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.climate_extreme_heat_precool_active
          - conditions:
              - condition: time
                after: "09:00:00"
                before: "21:00:00"
            sequence:
              - service: climate.set_temperature
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  target_temp_high: |
                    {{ states('input_number.climate_cool_day') | float }}
                  target_temp_low: |
                    {{ states('input_number.climate_heat_day') | float }}
          - conditions:
              - condition: time
                after: "21:00:00"
                before: "22:30:00"
            sequence:
              - service: climate.set_temperature
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  target_temp_high: |
                    {{ states('input_number.climate_cool_bedtime') | float }}
                  target_temp_low: |
                    {{ states('input_number.climate_heat_bedtime') | float }}
        default:
          - service: climate.set_temperature
            target:
              entity_id: climate.dining_room_thermostat
            data:
              target_temp_high: |
                {{ states('input_number.climate_cool_sleep') | float }}
              target_temp_low: |
                {{ states('input_number.climate_heat_sleep') | float }}
