# packages/window_ventilation.yaml
#
# Advisory window ventilation recommendations using indoor/outdoor comfort,
# moisture, rain forecast, HVAC state, and household-relative air-quality context.
#
# v1 is advisory only: dedicated window-contact coverage is not confirmed.
#
# Entity mapping is based on GitHub issue #103 triage/recon:
# - normalized weather seam sensors from packages/weather.yaml:
#   sensor.weather_outdoor_temperature / sensor.weather_outdoor_dew_point
# - sensor.precipitation_forecast_next_hour / sensor.condition_forecast_next_hour
# - sensor.dining_room_thermostat_temperature and sensor.thermostat_humidity,
#   with climate.dining_room_thermostat current attributes as fallback context
# - sensor.thermostat_carbon_dioxide / sensor.thermostat_vocs

input_boolean:
  window_ventilation_advisor_enabled:
    name: "Window Ventilation Advisor"
    icon: mdi:window-open-variant
    initial: true

input_number:
  window_ventilation_cooler_delta:
    name: "Window Ventilation Cooler Delta"
    min: 1
    max: 10
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermometer-chevron-down
    initial: 3

  window_ventilation_max_outdoor_dew_point:
    name: "Window Ventilation Max Outdoor Dew Point"
    min: 45
    max: 70
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:water-thermometer
    initial: 60

  window_ventilation_brief_purge_max_outdoor_temperature_delta:
    name: "Window Ventilation Brief Purge Max Outdoor Temperature Delta"
    min: 0
    max: 10
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermometer-plus
    initial: 5

  window_ventilation_brief_purge_max_outdoor_dew_point:
    name: "Window Ventilation Brief Purge Max Outdoor Dew Point"
    min: 60
    max: 75
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:water-thermometer-outline
    initial: 70

  window_ventilation_winter_threshold:
    name: "Window Ventilation Winter Threshold"
    min: 35
    max: 65
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:snowflake-thermometer
    initial: 55

  window_ventilation_high_indoor_humidity:
    name: "Window Ventilation High Indoor Humidity"
    min: 40
    max: 70
    step: 1
    unit_of_measurement: "%"
    icon: mdi:water-percent
    initial: 58

input_text:
  window_ventilation_active_notification_tag:
    name: "Window Ventilation Active Notification Tag"
    initial: "window-ventilation-advisor"
    max: 100

sensor:
  # Ecobee thermostat CO2/VOC updates arrive roughly every 30 seconds. A
  # 24-hour statistics window therefore needs about 2,880 samples; keep 3,600
  # so max_age, not sampling_size, controls the day-scale household baseline.
  - platform: statistics
    name: "Window Ventilation CO2 Baseline"
    unique_id: window_ventilation_co2_baseline
    entity_id: sensor.thermostat_carbon_dioxide
    state_characteristic: mean
    max_age:
      hours: 24
    sampling_size: 3600

  - platform: statistics
    name: "Window Ventilation VOC Baseline"
    unique_id: window_ventilation_voc_baseline
    entity_id: sensor.thermostat_vocs
    state_characteristic: mean
    max_age:
      hours: 24
    sampling_size: 3600

template:
  - sensor:
      - name: "Window Ventilation Indoor Dew Point"
        unique_id: window_ventilation_indoor_dew_point
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        availability: >
          {% set invalid = ['unknown', 'unavailable', '', none] %}
          {% set temp_sensor = states('sensor.dining_room_thermostat_temperature') %}
          {% set humidity_sensor = states('sensor.thermostat_humidity') %}
          {{ (temp_sensor not in invalid or state_attr('climate.dining_room_thermostat', 'current_temperature') is not none)
             and (humidity_sensor not in invalid or state_attr('climate.dining_room_thermostat', 'current_humidity') is not none) }}
        state: >
          {% set invalid = ['unknown', 'unavailable', '', none] %}
          {% set temp_sensor = states('sensor.dining_room_thermostat_temperature') %}
          {% set humidity_sensor = states('sensor.thermostat_humidity') %}
          {% set temp_f = (temp_sensor | float(none)) if temp_sensor not in invalid else (state_attr('climate.dining_room_thermostat', 'current_temperature') | float) %}
          {% set humidity = (humidity_sensor | float(none)) if humidity_sensor not in invalid else (state_attr('climate.dining_room_thermostat', 'current_humidity') | float) %}
          {# Approximate dew point from indoor thermostat temperature/humidity. #}
          {{ (temp_f - ((100 - humidity) * 0.36)) | round(1) }}

      - name: "Window Ventilation Decision Context"
        unique_id: window_ventilation_decision_context
        icon: mdi:clipboard-text-search-outline
        state: >
          {% set invalid = ['unknown', 'unavailable', '', none] %}
          {% set temp_sensor = states('sensor.dining_room_thermostat_temperature') %}
          {% set indoor = (temp_sensor | float(none)) if temp_sensor not in invalid else (state_attr('climate.dining_room_thermostat', 'current_temperature') | float(none)) %}
          {% set outdoor = states('sensor.weather_outdoor_temperature') | float(none) %}
          {% set outdoor_dew = states('sensor.weather_outdoor_dew_point') | float(none) %}
          {% set indoor_dew = states('sensor.window_ventilation_indoor_dew_point') | float(none) %}
          {% if indoor is not none and outdoor is not none and outdoor_dew is not none and indoor_dew is not none %}
            ready
          {% else %}
            not_ready
          {% endif %}
        attributes:
          advisory_only: true
          indoor_temperature: >
            {% set invalid = ['unknown', 'unavailable', '', none] %}
            {% set temp_sensor = states('sensor.dining_room_thermostat_temperature') %}
            {{ (temp_sensor | float(none)) if temp_sensor not in invalid else (state_attr('climate.dining_room_thermostat', 'current_temperature') | float(none)) }}
          indoor_humidity: >
            {% set invalid = ['unknown', 'unavailable', '', none] %}
            {% set humidity_sensor = states('sensor.thermostat_humidity') %}
            {{ (humidity_sensor | float(none)) if humidity_sensor not in invalid else (state_attr('climate.dining_room_thermostat', 'current_humidity') | float(none)) }}
          outdoor_temperature: "{{ states('sensor.weather_outdoor_temperature') | float(none) }}"
          indoor_dew_point: "{{ states('sensor.window_ventilation_indoor_dew_point') | float(none) }}"
          outdoor_dew_point: "{{ states('sensor.weather_outdoor_dew_point') | float(none) }}"
          rain_probability_next_hour: "{{ states('sensor.precipitation_forecast_next_hour') | float(0) }}"
          forecast_condition_next_hour: "{{ states('sensor.condition_forecast_next_hour') }}"
          hvac_action: "{{ state_attr('climate.dining_room_thermostat', 'hvac_action') | default('idle', true) }}"
          co2_current: "{{ states('sensor.thermostat_carbon_dioxide') | float(0) }}"
          co2_baseline: "{{ states('sensor.window_ventilation_co2_baseline') | float(0) }}"
          voc_current: "{{ states('sensor.thermostat_vocs') | float(0) }}"
          voc_baseline: "{{ states('sensor.window_ventilation_voc_baseline') | float(0) }}"
          cooler_delta: "{{ states('input_number.window_ventilation_cooler_delta') | float(3) }}"
          max_outdoor_dew_point: "{{ states('input_number.window_ventilation_max_outdoor_dew_point') | float(60) }}"
          brief_purge_max_outdoor_temperature_delta: "{{ states('input_number.window_ventilation_brief_purge_max_outdoor_temperature_delta') | float(5) }}"
          brief_purge_max_outdoor_dew_point: "{{ states('input_number.window_ventilation_brief_purge_max_outdoor_dew_point') | float(70) }}"
          winter_threshold: "{{ states('input_number.window_ventilation_winter_threshold') | float(55) }}"
          high_indoor_humidity: "{{ states('input_number.window_ventilation_high_indoor_humidity') | float(58) }}"
          air_quality_composite_status: "{{ states('sensor.air_quality_composite_status') }}"
          air_quality_trend: "{{ states('sensor.air_quality_trend') }}"
          data_ready: >
            {% set invalid = ['unknown', 'unavailable', '', none] %}
            {% set temp_sensor = states('sensor.dining_room_thermostat_temperature') %}
            {% set indoor = (temp_sensor | float(none)) if temp_sensor not in invalid else (state_attr('climate.dining_room_thermostat', 'current_temperature') | float(none)) %}
            {% set outdoor = states('sensor.weather_outdoor_temperature') | float(none) %}
            {% set outdoor_dew = states('sensor.weather_outdoor_dew_point') | float(none) %}
            {% set indoor_dew = states('sensor.window_ventilation_indoor_dew_point') | float(none) %}
            {{ indoor is not none and outdoor is not none and outdoor_dew is not none and indoor_dew is not none }}
          raining: >
            {% set rain_probability = states('sensor.precipitation_forecast_next_hour') | float(0) %}
            {% set condition = states('sensor.condition_forecast_next_hour') %}
            {{ rain_probability >= 30 or condition in ['rainy', 'pouring', 'snowy-rainy'] }}
          hvac_running: >
            {% set hvac_action = state_attr('climate.dining_room_thermostat', 'hvac_action') | default('idle', true) %}
            {{ hvac_action in ['heating', 'cooling'] }}
          winter_mode: >
            {% set outdoor = states('sensor.weather_outdoor_temperature') | float(none) %}
            {% set winter_threshold = states('input_number.window_ventilation_winter_threshold') | float(55) %}
            {{ outdoor is not none and outdoor < winter_threshold }}
          outdoor_cooler: >
            {% set invalid = ['unknown', 'unavailable', '', none] %}
            {% set temp_sensor = states('sensor.dining_room_thermostat_temperature') %}
            {% set indoor = (temp_sensor | float(none)) if temp_sensor not in invalid else (state_attr('climate.dining_room_thermostat', 'current_temperature') | float(none)) %}
            {% set outdoor = states('sensor.weather_outdoor_temperature') | float(none) %}
            {% set cooler_delta = states('input_number.window_ventilation_cooler_delta') | float(3) %}
            {{ indoor is not none and outdoor is not none and (indoor - outdoor) >= cooler_delta }}
          outdoor_drier: >
            {% set outdoor_dew = states('sensor.weather_outdoor_dew_point') | float(none) %}
            {% set indoor_dew = states('sensor.window_ventilation_indoor_dew_point') | float(none) %}
            {% set max_dew = states('input_number.window_ventilation_max_outdoor_dew_point') | float(60) %}
            {{ outdoor_dew is not none and indoor_dew is not none and outdoor_dew <= max_dew and outdoor_dew <= (indoor_dew + 2) }}
          outdoor_too_humid: >
            {% set outdoor_dew = states('sensor.weather_outdoor_dew_point') | float(none) %}
            {% set max_dew = states('input_number.window_ventilation_max_outdoor_dew_point') | float(60) %}
            {{ outdoor_dew is not none and outdoor_dew >= (max_dew + 5) }}
          outdoor_more_humid: >
            {% set outdoor_dew = states('sensor.weather_outdoor_dew_point') | float(none) %}
            {% set indoor_dew = states('sensor.window_ventilation_indoor_dew_point') | float(none) %}
            {{ outdoor_dew is not none and indoor_dew is not none and outdoor_dew > (indoor_dew + 2) }}
          co2_relative: >
            {% set co2 = states('sensor.thermostat_carbon_dioxide') | float(0) %}
            {% set co2_base = states('sensor.window_ventilation_co2_baseline') | float(0) %}
            {{ co2_base > 0 and co2 >= 900 and co2 >= (co2_base + 175) }}
          co2_outlier: >
            {% set co2 = states('sensor.thermostat_carbon_dioxide') | float(0) %}
            {% set co2_base = states('sensor.window_ventilation_co2_baseline') | float(0) %}
            {{ co2_base > 0 and co2 >= 1400 and co2 >= (co2_base + 100) }}
          voc_relative: >
            {% set voc = states('sensor.thermostat_vocs') | float(0) %}
            {% set voc_base = states('sensor.window_ventilation_voc_baseline') | float(0) %}
            {{ voc_base > 0 and voc >= 250 and voc >= (voc_base * 1.35) }}
          voc_outlier: >
            {% set voc = states('sensor.thermostat_vocs') | float(0) %}
            {% set voc_base = states('sensor.window_ventilation_voc_baseline') | float(0) %}
            {{ voc_base > 0 and voc >= 650 and voc >= (voc_base * 1.15) }}
          humidity_reason: >
            {% set invalid = ['unknown', 'unavailable', '', none] %}
            {% set humidity_sensor = states('sensor.thermostat_humidity') %}
            {% set indoor_humidity = (humidity_sensor | float(none)) if humidity_sensor not in invalid else (state_attr('climate.dining_room_thermostat', 'current_humidity') | float(none)) %}
            {% set high_humidity = states('input_number.window_ventilation_high_indoor_humidity') | float(58) %}
            {% set outdoor_dew = states('sensor.weather_outdoor_dew_point') | float(none) %}
            {% set indoor_dew = states('sensor.window_ventilation_indoor_dew_point') | float(none) %}
            {% set max_dew = states('input_number.window_ventilation_max_outdoor_dew_point') | float(60) %}
            {% set outdoor_drier = outdoor_dew is not none and indoor_dew is not none and outdoor_dew <= max_dew and outdoor_dew <= (indoor_dew + 2) %}
            {{ indoor_humidity is not none and indoor_humidity >= high_humidity and outdoor_drier }}
          air_quality_reason: >
            {% set co2 = states('sensor.thermostat_carbon_dioxide') | float(0) %}
            {% set voc = states('sensor.thermostat_vocs') | float(0) %}
            {% set co2_base = states('sensor.window_ventilation_co2_baseline') | float(0) %}
            {% set voc_base = states('sensor.window_ventilation_voc_baseline') | float(0) %}
            {% set co2_relative = co2_base > 0 and co2 >= 900 and co2 >= (co2_base + 175) %}
            {% set co2_outlier = co2_base > 0 and co2 >= 1400 and co2 >= (co2_base + 100) %}
            {% set voc_relative = voc_base > 0 and voc >= 250 and voc >= (voc_base * 1.35) %}
            {% set voc_outlier = voc_base > 0 and voc >= 650 and voc >= (voc_base * 1.15) %}
            {{ co2_relative or voc_relative or co2_outlier or voc_outlier }}
          severe_stale_air_reason: >
            {% set co2 = states('sensor.thermostat_carbon_dioxide') | float(0) %}
            {% set voc = states('sensor.thermostat_vocs') | float(0) %}
            {% set co2_base = states('sensor.window_ventilation_co2_baseline') | float(0) %}
            {% set voc_base = states('sensor.window_ventilation_voc_baseline') | float(0) %}
            {% set poor_air_quality = states('sensor.air_quality_composite_status') == 'poor' %}
            {% set worsening_air_quality = states('sensor.air_quality_trend') == 'worsening' %}
            {% set co2_severe = co2_base > 0 and co2 >= 1500 and co2 >= (co2_base + 400) %}
            {% set voc_severe = voc_base > 0 and voc >= 1000 and voc >= (voc_base * 1.75) %}
            {{ poor_air_quality and worsening_air_quality and (co2_severe or voc_severe) }}
          brief_purge_outdoor_temperature_ok: >
            {% set invalid = ['unknown', 'unavailable', '', none] %}
            {% set temp_sensor = states('sensor.dining_room_thermostat_temperature') %}
            {% set indoor = (temp_sensor | float(none)) if temp_sensor not in invalid else (state_attr('climate.dining_room_thermostat', 'current_temperature') | float(none)) %}
            {% set outdoor = states('sensor.weather_outdoor_temperature') | float(none) %}
            {% set max_warmer = states('input_number.window_ventilation_brief_purge_max_outdoor_temperature_delta') | float(5) %}
            {{ indoor is not none and outdoor is not none and outdoor <= (indoor + max_warmer) }}
          brief_purge_outdoor_dew_point_ok: >
            {% set outdoor_dew = states('sensor.weather_outdoor_dew_point') | float(none) %}
            {% set max_dew = states('input_number.window_ventilation_brief_purge_max_outdoor_dew_point') | float(70) %}
            {{ outdoor_dew is not none and outdoor_dew <= max_dew }}
          brief_purge: >
            {% set rain_probability = states('sensor.precipitation_forecast_next_hour') | float(0) %}
            {% set condition = states('sensor.condition_forecast_next_hour') %}
            {% set raining = rain_probability >= 30 or condition in ['rainy', 'pouring', 'snowy-rainy'] %}
            {% set hvac_action = state_attr('climate.dining_room_thermostat', 'hvac_action') | default('idle', true) %}
            {% set hvac_running = hvac_action in ['heating', 'cooling'] %}
            {% set co2 = states('sensor.thermostat_carbon_dioxide') | float(0) %}
            {% set voc = states('sensor.thermostat_vocs') | float(0) %}
            {% set co2_base = states('sensor.window_ventilation_co2_baseline') | float(0) %}
            {% set voc_base = states('sensor.window_ventilation_voc_baseline') | float(0) %}
            {% set poor_air_quality = states('sensor.air_quality_composite_status') == 'poor' %}
            {% set worsening_air_quality = states('sensor.air_quality_trend') == 'worsening' %}
            {% set co2_severe = co2_base > 0 and co2 >= 1500 and co2 >= (co2_base + 400) %}
            {% set voc_severe = voc_base > 0 and voc >= 1000 and voc >= (voc_base * 1.75) %}
            {% set severe_stale_air = poor_air_quality and worsening_air_quality and (co2_severe or voc_severe) %}
            {% set invalid = ['unknown', 'unavailable', '', none] %}
            {% set temp_sensor = states('sensor.dining_room_thermostat_temperature') %}
            {% set indoor = (temp_sensor | float(none)) if temp_sensor not in invalid else (state_attr('climate.dining_room_thermostat', 'current_temperature') | float(none)) %}
            {% set outdoor = states('sensor.weather_outdoor_temperature') | float(none) %}
            {% set max_warmer = states('input_number.window_ventilation_brief_purge_max_outdoor_temperature_delta') | float(5) %}
            {% set temperature_ok = indoor is not none and outdoor is not none and outdoor <= (indoor + max_warmer) %}
            {% set outdoor_dew = states('sensor.weather_outdoor_dew_point') | float(none) %}
            {% set max_dew = states('input_number.window_ventilation_brief_purge_max_outdoor_dew_point') | float(70) %}
            {% set dew_ok = outdoor_dew is not none and outdoor_dew <= max_dew %}
            {{ severe_stale_air and temperature_ok and dew_ok and not raining and not hvac_running }}
          mild_open: >
            {% set invalid = ['unknown', 'unavailable', '', none] %}
            {% set temp_sensor = states('sensor.dining_room_thermostat_temperature') %}
            {% set indoor = (temp_sensor | float(none)) if temp_sensor not in invalid else (state_attr('climate.dining_room_thermostat', 'current_temperature') | float(none)) %}
            {% set outdoor = states('sensor.weather_outdoor_temperature') | float(none) %}
            {% set cooler_delta = states('input_number.window_ventilation_cooler_delta') | float(3) %}
            {% set outdoor_cooler = indoor is not none and outdoor is not none and (indoor - outdoor) >= cooler_delta %}
            {% set outdoor_dew = states('sensor.weather_outdoor_dew_point') | float(none) %}
            {% set indoor_dew = states('sensor.window_ventilation_indoor_dew_point') | float(none) %}
            {% set max_dew = states('input_number.window_ventilation_max_outdoor_dew_point') | float(60) %}
            {% set outdoor_drier = outdoor_dew is not none and indoor_dew is not none and outdoor_dew <= max_dew and outdoor_dew <= (indoor_dew + 2) %}
            {% set rain_probability = states('sensor.precipitation_forecast_next_hour') | float(0) %}
            {% set condition = states('sensor.condition_forecast_next_hour') %}
            {% set raining = rain_probability >= 30 or condition in ['rainy', 'pouring', 'snowy-rainy'] %}
            {% set hvac_action = state_attr('climate.dining_room_thermostat', 'hvac_action') | default('idle', true) %}
            {% set hvac_running = hvac_action in ['heating', 'cooling'] %}
            {{ outdoor_cooler and outdoor_drier and not raining and not hvac_running }}

      - name: "Window Ventilation Recommendation"
        unique_id: window_ventilation_recommendation
        icon: >
          {% if this.state == 'open' %}
            mdi:window-open-variant
          {% elif this.state == 'open_briefly' %}
            mdi:window-open
          {% elif this.state == 'close' %}
            mdi:window-closed-variant
          {% else %}
            mdi:window-closed
          {% endif %}
        state: >
          {% set ctx = 'sensor.window_ventilation_decision_context' %}
          {% set data_ready = is_state(ctx, 'ready') %}
          {% set raining = state_attr(ctx, 'raining') | bool(false) %}
          {% set hvac_running = state_attr(ctx, 'hvac_running') | bool(false) %}
          {% set outdoor_too_humid = state_attr(ctx, 'outdoor_too_humid') | bool(false) %}
          {% set winter_mode = state_attr(ctx, 'winter_mode') | bool(false) %}
          {% set outdoor_cooler = state_attr(ctx, 'outdoor_cooler') | bool(false) %}
          {% set outdoor_drier = state_attr(ctx, 'outdoor_drier') | bool(false) %}
          {% set mild_open = state_attr(ctx, 'mild_open') | bool(false) %}
          {% set humidity_reason = state_attr(ctx, 'humidity_reason') | bool(false) %}
          {% set air_quality_reason = state_attr(ctx, 'air_quality_reason') | bool(false) %}
          {% set severe_stale_air_reason = state_attr(ctx, 'severe_stale_air_reason') | bool(false) %}
          {% set brief_purge_outdoor_temperature_ok = state_attr(ctx, 'brief_purge_outdoor_temperature_ok') | bool(false) %}
          {% set brief_purge_outdoor_dew_point_ok = state_attr(ctx, 'brief_purge_outdoor_dew_point_ok') | bool(false) %}
          {% set brief_purge = state_attr(ctx, 'brief_purge') | bool(false) %}
          {% if not data_ready %}
            neutral
          {% elif raining or hvac_running %}
            close
          {% elif winter_mode %}
            {% if not hvac_running and not raining and outdoor_drier and (air_quality_reason or humidity_reason) %}
              open
            {% else %}
              neutral
            {% endif %}
          {% elif mild_open %}
            open
          {% elif brief_purge %}
            open_briefly
          {% elif outdoor_too_humid or not outdoor_cooler or not outdoor_drier %}
            close
          {% else %}
            neutral
          {% endif %}
        attributes:
          advisory_only: true
          mode: >
            {% set ctx = 'sensor.window_ventilation_decision_context' %}
            {% if state_attr(ctx, 'brief_purge') | bool(false) %}
              brief_purge
            {% elif state_attr(ctx, 'winter_mode') | bool(false) %}
              winter_purge
            {% else %}
              comfort
            {% endif %}
          context_entity: sensor.window_ventilation_decision_context
          indoor_temperature: "{{ state_attr('sensor.window_ventilation_decision_context', 'indoor_temperature') }}"
          outdoor_temperature: "{{ state_attr('sensor.window_ventilation_decision_context', 'outdoor_temperature') }}"
          indoor_dew_point: "{{ state_attr('sensor.window_ventilation_decision_context', 'indoor_dew_point') }}"
          outdoor_dew_point: "{{ state_attr('sensor.window_ventilation_decision_context', 'outdoor_dew_point') }}"
          rain_probability_next_hour: "{{ state_attr('sensor.window_ventilation_decision_context', 'rain_probability_next_hour') }}"
          hvac_action: "{{ state_attr('sensor.window_ventilation_decision_context', 'hvac_action') }}"
          co2_current: "{{ state_attr('sensor.window_ventilation_decision_context', 'co2_current') }}"
          co2_baseline: "{{ state_attr('sensor.window_ventilation_decision_context', 'co2_baseline') }}"
          voc_current: "{{ state_attr('sensor.window_ventilation_decision_context', 'voc_current') }}"
          voc_baseline: "{{ state_attr('sensor.window_ventilation_decision_context', 'voc_baseline') }}"

      - name: "Window Ventilation Reason"
        unique_id: window_ventilation_reason
        icon: mdi:text-box-search-outline
        state: >
          {% set ctx = 'sensor.window_ventilation_decision_context' %}
          {% set rec = states('sensor.window_ventilation_recommendation') %}
          {% set mode = state_attr('sensor.window_ventilation_recommendation', 'mode') | trim %}
          {% set indoor = state_attr(ctx, 'indoor_temperature') | float(none) %}
          {% set indoor_humidity = state_attr(ctx, 'indoor_humidity') | float(none) %}
          {% set outdoor = state_attr(ctx, 'outdoor_temperature') | float(none) %}
          {% set indoor_dew = state_attr(ctx, 'indoor_dew_point') | float(none) %}
          {% set outdoor_dew = state_attr(ctx, 'outdoor_dew_point') | float(none) %}
          {% set high_humidity = state_attr(ctx, 'high_indoor_humidity') | float(58) %}
          {% set hvac_action = state_attr(ctx, 'hvac_action') | default('idle', true) %}
          {% set raining = state_attr(ctx, 'raining') | bool(false) %}
          {% set hvac_running = state_attr(ctx, 'hvac_running') | bool(false) %}
          {% set outdoor_more_humid = state_attr(ctx, 'outdoor_more_humid') | bool(false) %}
          {% set co2_relative = state_attr(ctx, 'co2_relative') | bool(false) %}
          {% set voc_relative = state_attr(ctx, 'voc_relative') | bool(false) %}
          {% if rec == 'open' and mode == 'winter_purge' %}
            Air out the house for 5-10 minutes: indoor air or humidity is above the home's recent baseline, outdoor dew point is acceptable, and HVAC is idle.
          {% elif rec == 'open_briefly' %}
            Briefly open windows for a short purge (5-10 minutes): indoor air is poor and worsening versus recent baselines, while outdoor temperature and dew point are within bounded compromise limits. Close windows after the short purge.
          {% elif rec == 'open' %}
            Open windows: outside is {{ (indoor - outdoor) | round(0) }}°F cooler, outdoor dew point is {{ outdoor_dew | round(0) }}°F vs indoor {{ indoor_dew | round(0) }}°F, and no rain or HVAC conflict is active.
          {% elif rec == 'close' and raining %}
            Close windows: rain or mixed precipitation is expected within the hour.
          {% elif rec == 'close' and hvac_running %}
            Close windows: HVAC is currently {{ hvac_action }}.
          {% elif rec == 'close' and outdoor_more_humid %}
            Close windows: outside air is more humid (dew point {{ outdoor_dew | round(0) }}°F vs indoor {{ indoor_dew | round(0) }}°F).
          {% elif rec == 'close' %}
            Close windows: outdoor conditions are no longer meaningfully better than indoors.
          {% elif mode == 'winter_purge' %}
            Keep windows closed: outside is cold, HVAC/rain and indoor moisture checks do not justify a brief purge right now.
          {% elif co2_relative or voc_relative %}
            Neutral: indoor air is above the recent household baseline, but outdoor comfort or HVAC conditions are not favorable enough for a window recommendation.
          {% elif indoor_humidity is not none and indoor_humidity >= high_humidity %}
            Neutral: indoor humidity is elevated, but outdoor conditions are not clearly better.
          {% else %}
            Neutral: indoor/outdoor comfort, rain, HVAC, and recent air-quality context do not call for a window change.
          {% endif %}

  - binary_sensor:
      - name: "Window Ventilation Favorable"
        unique_id: window_ventilation_favorable
        icon: mdi:window-open-variant
        state: "{{ is_state('sensor.window_ventilation_recommendation', 'open') }}"

      - name: "Window Ventilation Unfavorable"
        unique_id: window_ventilation_unfavorable
        icon: mdi:window-closed-variant
        state: "{{ is_state('sensor.window_ventilation_recommendation', 'close') }}"

      - name: "Window Ventilation Brief Purge"
        unique_id: window_ventilation_brief_purge
        icon: mdi:window-open
        state: "{{ is_state('sensor.window_ventilation_recommendation', 'open_briefly') }}"

automation:
  - alias: "window_ventilation_open_advisory"
    id: "window_ventilation_open_advisory"
    description: "Notify on stable open/purge window ventilation recommendation"
    trigger:
      - platform: state
        entity_id: sensor.window_ventilation_recommendation
        to: "open"
        for:
          minutes: 15
      - platform: state
        entity_id: sensor.window_ventilation_recommendation
        to: "open_briefly"
        for:
          minutes: 15
    condition:
      - condition: state
        entity_id: input_boolean.window_ventilation_advisor_enabled
        state: "on"
      - condition: numeric_state
        entity_id: zone.home
        above: 0
      - condition: time
        after: "05:00:00"
        before: "22:00:00"
    action:
      - variables:
          mode: "{{ state_attr('sensor.window_ventilation_recommendation', 'mode') | trim }}"
          reason: "{{ states('sensor.window_ventilation_reason') }}"
          notification_message: >
            {% if mode == 'brief_purge' %}
              5-10 minute short purge: {{ reason }}
            {% else %}
              {{ reason }}
            {% endif %}
          tag: "{{ states('input_text.window_ventilation_active_notification_tag') }}"
      - service: notify.all_mobile_devices
        data:
          title: >
            {% if mode == 'winter_purge' %}
              Window Ventilation: Brief Airing
            {% elif mode == 'brief_purge' %}
              Window Ventilation: Brief Purge
            {% else %}
              Window Ventilation: Open Windows
            {% endif %}
          message: "{{ notification_message }}"
          data:
            tag: "{{ tag }}"
            when: "{{ now().timestamp() | int }}"
            priority: "normal"
            ttl: 0

  - alias: "window_ventilation_close_advisory"
    id: "window_ventilation_close_advisory"
    description: "Notify when a stable open recommendation becomes close"
    trigger:
      - platform: state
        entity_id: sensor.window_ventilation_recommendation
        from: "open"
        to: "close"
        for:
          minutes: 7
      - platform: state
        entity_id: sensor.window_ventilation_recommendation
        from: "open_briefly"
        to: "close"
        for:
          minutes: 7
    condition:
      - condition: state
        entity_id: input_boolean.window_ventilation_advisor_enabled
        state: "on"
      - condition: numeric_state
        entity_id: zone.home
        above: 0
      - condition: time
        after: "05:00:00"
        before: "22:00:00"
    action:
      - variables:
          reason: "{{ states('sensor.window_ventilation_reason') }}"
          tag: "{{ states('input_text.window_ventilation_active_notification_tag') }}"
      - service: notify.all_mobile_devices
        data:
          title: "Window Ventilation: Close Windows"
          message: "{{ reason }}"
          data:
            tag: "{{ tag }}"
            when: "{{ now().timestamp() | int }}"
            priority: "normal"
            ttl: 0

  - alias: "window_ventilation_neutral_clear_notification"
    id: "window_ventilation_neutral_clear_notification"
    description: "Clear the active advisory notification when conditions settle"
    trigger:
      - platform: state
        entity_id: sensor.window_ventilation_recommendation
        to: "neutral"
        for:
          minutes: 5
    condition:
      - condition: state
        entity_id: input_boolean.window_ventilation_advisor_enabled
        state: "on"
    action:
      - service: notify.all_mobile_devices
        data:
          message: "clear_notification"
          data:
            tag: "{{ states('input_text.window_ventilation_active_notification_tag') }}"
