# packages/climate_control.yaml
#
# Smart HVAC Automation System
#
# Features:
# - Intelligent time-based temperature scheduling
# - Separate heating and cooling setpoints for all time periods
# - Presence-aware away mode with energy-saving setbacks
# - Manual changes persist until next scheduled automation
# - Guest mode integration (respects existing presence system)
# - Fully configurable via UI helpers
#
# Schedule:
# - Weekday mornings: 5:00 AM warmup (Mon-Fri)
# - Weekend mornings: 7:00 AM warmup (Sat-Sun)
# - Daytime: 9:00 AM comfortable temps
# - Bedtime: 9:00 PM comfort warmup
# - Sleep: 10:30 PM cooler temps for better sleep
# - Away: Energy-saving setbacks when nobody home
#
# Integration:
# - Works with climate.dining_room_thermostat (Ecobee)
# - Integrates with existing zone.home presence detection
# - Respects input_boolean.mode_guest for guest handling
# - Ensures heat_cool (auto) mode year-round
# - Schedule automations skip when nobody is home (away mode handles temps)

homeassistant:
  customize:
    package.node_anchors:
      # Default heating setpoints (winter)
      heat_morning: &heat_morning 70
      heat_day: &heat_day 68
      heat_bedtime: &heat_bedtime 70
      heat_sleep: &heat_sleep 66
      heat_away: &heat_away 62
      # Default cooling setpoints (summer)
      cool_morning: &cool_morning 74
      cool_day: &cool_day 76
      cool_bedtime: &cool_bedtime 72
      cool_sleep: &cool_sleep 72
      cool_away: &cool_away 78

# Helper entities for temperature setpoints
input_number:
  climate_heat_morning:
    name: "Climate Heat - Morning"
    min: 60
    max: 80
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer-chevron-up
    initial: *heat_morning

  climate_heat_day:
    name: "Climate Heat - Daytime"
    min: 60
    max: 80
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer
    initial: *heat_day

  climate_heat_bedtime:
    name: "Climate Heat - Bedtime"
    min: 60
    max: 80
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer-chevron-up
    initial: *heat_bedtime

  climate_heat_sleep:
    name: "Climate Heat - Sleep"
    min: 60
    max: 80
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer-chevron-down
    initial: *heat_sleep

  climate_heat_away:
    name: "Climate Heat - Away"
    min: 55
    max: 75
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer-low
    initial: *heat_away

  climate_cool_morning:
    name: "Climate Cool - Morning"
    min: 65
    max: 85
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:snowflake
    initial: *cool_morning

  climate_cool_day:
    name: "Climate Cool - Daytime"
    min: 65
    max: 85
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:snowflake
    initial: *cool_day

  climate_cool_bedtime:
    name: "Climate Cool - Bedtime"
    min: 65
    max: 85
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:snowflake
    initial: *cool_bedtime

  climate_cool_sleep:
    name: "Climate Cool - Sleep"
    min: 65
    max: 85
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:snowflake
    initial: *cool_sleep

  climate_cool_away:
    name: "Climate Cool - Away"
    min: 70
    max: 85
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:snowflake-thermometer
    initial: *cool_away

  climate_extreme_heat_threshold:
    name: "Climate Extreme Heat Threshold"
    min: 85
    max: 110
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer-alert
    initial: 95

  climate_extreme_heat_precool_offset:
    name: "Climate Extreme Heat Pre-cool Offset"
    min: 0
    max: 2
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:snowflake-thermometer
    initial: 1

  climate_precool_arrival_distance_ft:
    name: "Climate Pre-arrival Distance"
    min: 1000
    max: 60000
    step: 500
    unit_of_measurement: "ft"
    icon: mdi:map-marker-distance
    initial: 30000

  climate_precool_arrival_signal_max_age:
    name: "Climate Pre-arrival Signal Max Age"
    min: 5
    max: 60
    step: 5
    unit_of_measurement: "min"
    icon: mdi:timer-alert-outline
    initial: 20

# State tracking helpers
input_boolean:
  climate_automation_enabled:
    name: "Climate Automation"
    icon: mdi:thermostat-auto
    initial: true

  climate_extreme_heat_overlay_enabled:
    name: "Climate Extreme Heat Overlay"
    icon: mdi:sun-thermometer
    initial: true

  climate_extreme_heat_precool_active:
    name: "Climate Extreme Heat Pre-cool Active"
    icon: mdi:snowflake-alert
    initial: false

template:
  - binary_sensor:
      - name: "Climate Extreme Heat Day"
        unique_id: climate_extreme_heat_day
        icon: mdi:sun-thermometer
        availability: >
          {% set daily_state = states('sensor.weather_daily_forecast') %}
          {% set threshold = states('input_number.climate_extreme_heat_threshold') | float(none) %}
          {{ daily_state not in ['unknown', 'unavailable', '', none] and threshold is not none }}
        state: >
          {#
            NWS twice-daily forecast periods in this deployment expose
            temperature values in Fahrenheit. Use the normalized forecast
            attribute directly instead of the older derived high-temp helper
            so the hot-day decision is not dependent on ambiguous units.
          #}
          {% set threshold = states('input_number.climate_extreme_heat_threshold') | float(95) %}
          {% set source_entity = state_attr('sensor.weather_daily_forecast', 'source_entity') | default('weather.nws_home_kmle', true) %}
          {% set direct_forecast = state_attr('sensor.weather_daily_forecast', 'forecast') %}
          {% set source_payload = state_attr('sensor.weather_daily_forecast', source_entity) %}
          {% set forecast = direct_forecast if direct_forecast is not none else source_payload.forecast if source_payload is mapping and source_payload.forecast is defined else [] %}
          {% set ns = namespace(high=none) %}
          {% for period in forecast[:2] %}
            {% set temp = period.temperature | float(none) %}
            {% if temp is not none and (ns.high is none or temp > ns.high) %}
              {% set ns.high = temp %}
            {% endif %}
          {% endfor %}
          {{ ns.high is not none and ns.high >= threshold }}
        attributes:
          forecast_high_f: >
            {% set source_entity = state_attr('sensor.weather_daily_forecast', 'source_entity') | default('weather.nws_home_kmle', true) %}
            {% set direct_forecast = state_attr('sensor.weather_daily_forecast', 'forecast') %}
            {% set source_payload = state_attr('sensor.weather_daily_forecast', source_entity) %}
            {% set forecast = direct_forecast if direct_forecast is not none else source_payload.forecast if source_payload is mapping and source_payload.forecast is defined else [] %}
            {% set ns = namespace(high=none) %}
            {% for period in forecast[:2] %}
              {% set temp = period.temperature | float(none) %}
              {% if temp is not none and (ns.high is none or temp > ns.high) %}
                {% set ns.high = temp %}
              {% endif %}
            {% endfor %}
            {{ ns.high if ns.high is not none else 'unknown' }}
          threshold_f: "{{ states('input_number.climate_extreme_heat_threshold') | float(95) }}"
          forecast_source: "sensor.weather_daily_forecast"
          forecast_unit_assumption: "NWS forecast temperature attribute is Fahrenheit"
          decision_scope: "maximum temperature from the first two twice-daily periods"

      - name: "Climate Pre-arrival Expected"
        unique_id: climate_pre_arrival_expected
        icon: mdi:home-import-outline
        availability: >
          {{ states('input_number.climate_precool_arrival_distance_ft') not in ['unknown', 'unavailable', '', none]
             and states('input_number.climate_precool_arrival_signal_max_age') not in ['unknown', 'unavailable', '', none] }}
        state: >
          {#
            Pre-arrival uses person-level Home Assistant abstractions plus
            proximity sensors, not raw tracker entities.
            To add another climate pre-arrival person, add one entry to this
            map with that person entity and its Home proximity distance/direction
            sensors.
          #}
          {% set tracked = {
            'person.brian': {
              'name': 'Brian',
              'distance': 'sensor.home_brian_distance',
              'direction': 'sensor.home_brian_direction_of_travel'
            },
            'person.hester': {
              'name': 'Hester',
              'distance': 'sensor.home_hester_distance',
              'direction': 'sensor.home_hester_direction_of_travel'
            }
          } %}
          {% set max_distance = states('input_number.climate_precool_arrival_distance_ft') | float(30000) %}
          {% set max_age = states('input_number.climate_precool_arrival_signal_max_age') | float(20) * 60 %}
          {% set now_ts = as_timestamp(now()) %}
          {% set ns = namespace(expected=false) %}
          {% for person, signals in tracked.items() %}
            {% set distance_state = states(signals.distance) %}
            {% set distance = distance_state | float(none) %}
            {% set direction = states(signals.direction) %}
            {% set person_state = states(person) %}
            {% set distance_obj = states[signals.distance] if signals.distance in states else none %}
            {% set direction_obj = states[signals.direction] if signals.direction in states else none %}
            {% set distance_age = now_ts - as_timestamp(distance_obj.last_updated, 0) if distance_obj is not none else max_age + 1 %}
            {% set direction_age = now_ts - as_timestamp(direction_obj.last_updated, 0) if direction_obj is not none else max_age + 1 %}
            {% if person_state != 'home'
                  and distance is not none
                  and distance <= max_distance
                  and direction == 'towards'
                  and distance_age <= max_age
                  and direction_age <= max_age %}
              {% set ns.expected = true %}
            {% endif %}
          {% endfor %}
          {{ ns.expected }}
        attributes:
          eligible_people: "Brian, Hester"
          source_pattern: "person entity plus Home proximity distance/direction sensors"
          max_distance_ft: "{{ states('input_number.climate_precool_arrival_distance_ft') | float(30000) }}"
          max_signal_age_min: "{{ states('input_number.climate_precool_arrival_signal_max_age') | float(20) }}"
          expected_people: >
            {% set tracked = {
              'person.brian': {
                'name': 'Brian',
                'distance': 'sensor.home_brian_distance',
                'direction': 'sensor.home_brian_direction_of_travel'
              },
              'person.hester': {
                'name': 'Hester',
                'distance': 'sensor.home_hester_distance',
                'direction': 'sensor.home_hester_direction_of_travel'
              }
            } %}
            {% set max_distance = states('input_number.climate_precool_arrival_distance_ft') | float(30000) %}
            {% set max_age = states('input_number.climate_precool_arrival_signal_max_age') | float(20) * 60 %}
            {% set now_ts = as_timestamp(now()) %}
            {% set ns = namespace(names=[]) %}
            {% for person, signals in tracked.items() %}
              {% set distance = states(signals.distance) | float(none) %}
              {% set direction = states(signals.direction) %}
              {% set distance_obj = states[signals.distance] if signals.distance in states else none %}
              {% set direction_obj = states[signals.direction] if signals.direction in states else none %}
              {% set distance_age = now_ts - as_timestamp(distance_obj.last_updated, 0) if distance_obj is not none else max_age + 1 %}
              {% set direction_age = now_ts - as_timestamp(direction_obj.last_updated, 0) if direction_obj is not none else max_age + 1 %}
              {% if states(person) != 'home'
                    and distance is not none
                    and distance <= max_distance
                    and direction == 'towards'
                    and distance_age <= max_age
                    and direction_age <= max_age %}
                {% set ns.names = ns.names + [signals.name] %}
              {% endif %}
            {% endfor %}
            {{ ns.names | join(', ') if ns.names else 'none' }}
          reason: >
            Requires an eligible person not already home, a fresh proximity
            direction of 'towards', and distance below the configured threshold.

# Automations
automation:
  # ============================================================================
  # TIME-BASED SCHEDULE AUTOMATIONS
  # ============================================================================

  - alias: "climate_schedule_morning_weekday"
    id: "climate_schedule_morning_weekday"
    description: "Set morning temperature for weekdays (Mon-Fri)"
    trigger:
      - platform: time
        at: "05:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
      - condition: time
        weekday:
          - mon
          - tue
          - wed
          - thu
          - fri
      - condition: or
        conditions:
          - condition: numeric_state
            entity_id: zone.home
            above: 0
          - condition: state
            entity_id: input_boolean.mode_guest
            state: "on"
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      - service: climate.set_temperature
        target:
          entity_id: climate.dining_room_thermostat
        data:
          target_temp_high: >
            {{ states('input_number.climate_cool_morning') | float }}
          target_temp_low: >
            {{ states('input_number.climate_heat_morning') | float }}

  - alias: "climate_schedule_morning_weekend"
    id: "climate_schedule_morning_weekend"
    description: "Set morning temperature for weekends (Sat-Sun)"
    trigger:
      - platform: time
        at: "07:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
      - condition: time
        weekday:
          - sat
          - sun
      - condition: or
        conditions:
          - condition: numeric_state
            entity_id: zone.home
            above: 0
          - condition: state
            entity_id: input_boolean.mode_guest
            state: "on"
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      - service: climate.set_temperature
        target:
          entity_id: climate.dining_room_thermostat
        data:
          target_temp_high: >
            {{ states('input_number.climate_cool_morning') | float }}
          target_temp_low: >
            {{ states('input_number.climate_heat_morning') | float }}

  - alias: "climate_schedule_day"
    id: "climate_schedule_day"
    description: "Set daytime temperature (all days)"
    trigger:
      - platform: time
        at: "09:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
      - condition: or
        conditions:
          - condition: numeric_state
            entity_id: zone.home
            above: 0
          - condition: state
            entity_id: input_boolean.mode_guest
            state: "on"
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      - service: climate.set_temperature
        target:
          entity_id: climate.dining_room_thermostat
        data:
          target_temp_high: >
            {{ states('input_number.climate_cool_day') | float }}
          target_temp_low: >
            {{ states('input_number.climate_heat_day') | float }}

  - alias: "climate_extreme_heat_precool_apply"
    id: "climate_extreme_heat_precool_apply"
    description: >
      Apply a one-time daytime cooling offset on validated extreme-heat days.
    trigger:
      - platform: time
        at: "13:00:00"
        id: overlay_window_start
      - platform: state
        entity_id: binary_sensor.climate_extreme_heat_day
        to: "on"
        id: hot_day_detected
      - platform: state
        entity_id: input_boolean.mode_guest
        to: "on"
        id: guest_mode_enabled
      - platform: state
        entity_id: binary_sensor.climate_pre_arrival_expected
        to: "on"
        for:
          minutes: 2
        id: prearrival_expected
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.climate_extreme_heat_overlay_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.climate_extreme_heat_day
        state: "on"
      - condition: state
        entity_id: input_boolean.climate_extreme_heat_precool_active
        state: "off"
      - condition: time
        after: "12:59:00"
        before: "18:00:00"
      # Occupied/guest path preserves the original overlay. Pre-arrival may
      # also apply while nobody is home when a fresh aggregate person/proximity
      # signal says an eligible resident is heading home soon.
      - condition: or
        conditions:
          - condition: numeric_state
            entity_id: zone.home
            above: 0
          - condition: state
            entity_id: input_boolean.mode_guest
            state: "on"
          - condition: state
            entity_id: binary_sensor.climate_pre_arrival_expected
            state: "on"
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      - service: climate.set_temperature
        target:
          entity_id: climate.dining_room_thermostat
        data:
          target_temp_high: >
            {% set day = states('input_number.climate_cool_day') | float %}
            {% set offset = states('input_number.climate_extreme_heat_precool_offset') | float(1) %}
            {{ [day - offset, 65] | max }}
          target_temp_low: >
            {{ states('input_number.climate_heat_day') | float }}
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.climate_extreme_heat_precool_active
    mode: single

  - alias: "climate_extreme_heat_precool_restore"
    id: "climate_extreme_heat_precool_restore"
    description: >
      End the bounded extreme-heat pre-cool overlay and restore daytime targets.
    trigger:
      - platform: time
        at: "18:00:00"
        id: overlay_window_end
      - platform: state
        entity_id: input_boolean.climate_extreme_heat_overlay_enabled
        to: "off"
        id: overlay_disabled
      - platform: state
        entity_id: input_boolean.climate_automation_enabled
        to: "off"
        id: climate_disabled
      - platform: numeric_state
        entity_id: zone.home
        below: 1
        for:
          minutes: 5
        id: away_started
      - platform: state
        entity_id: binary_sensor.climate_pre_arrival_expected
        to: "off"
        for:
          minutes: 10
        id: prearrival_cleared
    condition:
      - condition: state
        entity_id: input_boolean.climate_extreme_heat_precool_active
        state: "on"
      # Only use the pre-arrival clear trigger as an abandoned-trip cancel.
      # If someone has arrived, let the normal occupied overlay continue until
      # the existing end-of-window/away-mode restore paths run.
      - condition: or
        conditions:
          - condition: template
            value_template: "{{ trigger.id != 'prearrival_cleared' }}"
          - condition: and
            conditions:
              - condition: numeric_state
                entity_id: zone.home
                below: 1
              - condition: state
                entity_id: input_boolean.mode_guest
                state: "off"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.climate_extreme_heat_precool_active
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ trigger.id in [
                    'prearrival_cleared',
                    'overlay_window_end',
                    'overlay_disabled',
                    'climate_disabled'
                  ] }}
              - condition: numeric_state
                entity_id: zone.home
                below: 1
              - condition: state
                entity_id: input_boolean.mode_guest
                state: "off"
            sequence:
              - service: climate.set_hvac_mode
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  hvac_mode: heat_cool
              - service: climate.set_temperature
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  target_temp_high: >
                    {{ states('input_number.climate_cool_away') | float }}
                  target_temp_low: >
                    {{ states('input_number.climate_heat_away') | float }}
          - conditions:
              - condition: template
                value_template: "{{ trigger.id != 'away_started' }}"
              - condition: state
                entity_id: input_boolean.climate_automation_enabled
                state: "on"
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity_id: zone.home
                    above: 0
                  - condition: state
                    entity_id: input_boolean.mode_guest
                    state: "on"
              - condition: time
                after: "09:00:00"
                before: "21:00:00"
            sequence:
              - service: climate.set_hvac_mode
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  hvac_mode: heat_cool
              - service: climate.set_temperature
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  target_temp_high: >
                    {{ states('input_number.climate_cool_day') | float }}
                  target_temp_low: >
                    {{ states('input_number.climate_heat_day') | float }}
    mode: single

  - alias: "climate_schedule_bedtime"
    id: "climate_schedule_bedtime"
    description: "Set bedtime comfort temperature (all days)"
    trigger:
      - platform: time
        at: "21:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
      - condition: or
        conditions:
          - condition: numeric_state
            entity_id: zone.home
            above: 0
          - condition: state
            entity_id: input_boolean.mode_guest
            state: "on"
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      - service: climate.set_temperature
        target:
          entity_id: climate.dining_room_thermostat
        data:
          target_temp_high: >
            {{ states('input_number.climate_cool_bedtime') | float }}
          target_temp_low: >
            {{ states('input_number.climate_heat_bedtime') | float }}

  - alias: "climate_schedule_sleep"
    id: "climate_schedule_sleep"
    description: "Set sleep temperature (all days)"
    trigger:
      - platform: time
        at: "22:30:00"
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
      - condition: or
        conditions:
          - condition: numeric_state
            entity_id: zone.home
            above: 0
          - condition: state
            entity_id: input_boolean.mode_guest
            state: "on"
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      - service: climate.set_temperature
        target:
          entity_id: climate.dining_room_thermostat
        data:
          target_temp_high: >
            {{ states('input_number.climate_cool_sleep') | float }}
          target_temp_low: >
            {{ states('input_number.climate_heat_sleep') | float }}

  # ============================================================================
  # PRESENCE-BASED AUTOMATIONS
  # ============================================================================

  - alias: "climate_away_mode_activate"
    id: "climate_away_mode_activate"
    description: "Activate energy-saving temps when everyone leaves"
    trigger:
      - platform: numeric_state
        entity_id: zone.home
        below: 1
        for:
          minutes: 5
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
      # Don't activate away mode if guest mode is on
      - condition: state
        entity_id: input_boolean.mode_guest
        state: "off"
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      - service: climate.set_temperature
        target:
          entity_id: climate.dining_room_thermostat
        data:
          target_temp_high: >
            {{ states('input_number.climate_cool_away') | float }}
          target_temp_low: >
            {{ states('input_number.climate_heat_away') | float }}

  - alias: "climate_away_mode_deactivate"
    id: "climate_away_mode_deactivate"
    description: "Resume schedule when someone returns home"
    trigger:
      - platform: numeric_state
        entity_id: zone.home
        above: 0
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
    action:
      # Ensure heat_cool mode first
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      # Determine which schedule to resume based on current time
      - choose:
          # Morning (5:00-8:59 weekdays, 7:00-8:59 weekends)
          - conditions:
              - condition: or
                conditions:
                  - condition: and
                    conditions:
                      - condition: time
                        after: "05:00:00"
                        before: "09:00:00"
                      - condition: time
                        weekday:
                          - mon
                          - tue
                          - wed
                          - thu
                          - fri
                  - condition: and
                    conditions:
                      - condition: time
                        after: "07:00:00"
                        before: "09:00:00"
                      - condition: time
                        weekday:
                          - sat
                          - sun
            sequence:
              - service: climate.set_temperature
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  target_temp_high: >
                    {{ states('input_number.climate_cool_morning') | float }}
                  target_temp_low: >
                    {{ states('input_number.climate_heat_morning') | float }}
          # Extreme heat overlay window (13:00-17:59). Handle return-home here
          # instead of in a second zone.home automation so this path is not
          # order-dependent with the normal daytime restore.
          - conditions:
              - condition: state
                entity_id: input_boolean.climate_extreme_heat_overlay_enabled
                state: "on"
              - condition: state
                entity_id: binary_sensor.climate_extreme_heat_day
                state: "on"
              - condition: time
                after: "12:59:00"
                before: "18:00:00"
            sequence:
              - service: climate.set_temperature
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  target_temp_high: >
                    {% set day = states('input_number.climate_cool_day') | float %}
                    {% set offset = states('input_number.climate_extreme_heat_precool_offset') | float(1) %}
                    {{ [day - offset, 65] | max }}
                  target_temp_low: >
                    {{ states('input_number.climate_heat_day') | float }}
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.climate_extreme_heat_precool_active
          # Daytime (9:00-20:59)
          - conditions:
              - condition: time
                after: "09:00:00"
                before: "21:00:00"
            sequence:
              - service: climate.set_temperature
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  target_temp_high: >
                    {{ states('input_number.climate_cool_day') | float }}
                  target_temp_low: >
                    {{ states('input_number.climate_heat_day') | float }}
          # Bedtime (21:00-22:29)
          - conditions:
              - condition: time
                after: "21:00:00"
                before: "22:30:00"
            sequence:
              - service: climate.set_temperature
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  target_temp_high: >
                    {{ states('input_number.climate_cool_bedtime') | float }}
                  target_temp_low: >
                    {{ states('input_number.climate_heat_bedtime') | float }}
        # Default: Sleep temps (22:30-04:59)
        default:
          - service: climate.set_temperature
            target:
              entity_id: climate.dining_room_thermostat
            data:
              target_temp_high: >
                {{ states('input_number.climate_cool_sleep') | float }}
              target_temp_low: >
                {{ states('input_number.climate_heat_sleep') | float }}
