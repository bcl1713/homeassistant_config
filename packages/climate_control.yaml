# packages/climate_control.yaml
#
# Smart HVAC Automation System
#
# Features:
# - Intelligent time-based temperature scheduling
# - Separate heating and cooling setpoints for all time periods
# - Presence-aware away mode with energy-saving setbacks
# - Manual changes persist until next scheduled automation
# - Guest mode integration (respects existing presence system)
# - Fully configurable via UI helpers
#
# Schedule:
# - Weekday mornings: 5:00 AM warmup (Mon-Fri)
# - Weekend mornings: 7:00 AM warmup (Sat-Sun)
# - Daytime: 9:00 AM comfortable temps
# - Bedtime: 9:00 PM comfort warmup
# - Sleep: 10:30 PM cooler temps for better sleep
# - Away: Energy-saving setbacks when nobody home
#
# Integration:
# - Works with climate.dining_room_thermostat (Ecobee)
# - Integrates with existing zone.home presence detection
# - Respects input_boolean.mode_guest for guest handling
# - Ensures heat_cool (auto) mode year-round
# - Schedule automations skip when nobody is home (away mode handles temps)

homeassistant:
  customize:
    package.node_anchors:
      # Default heating setpoints (winter)
      heat_morning: &heat_morning 70
      heat_day: &heat_day 68
      heat_bedtime: &heat_bedtime 70
      heat_sleep: &heat_sleep 66
      heat_away: &heat_away 62
      # Default cooling setpoints (summer)
      cool_morning: &cool_morning 74
      cool_day: &cool_day 76
      cool_bedtime: &cool_bedtime 72
      cool_sleep: &cool_sleep 72
      cool_away: &cool_away 78

# Helper entities for temperature setpoints
input_number:
  climate_heat_morning:
    name: "Climate Heat - Morning"
    min: 60
    max: 80
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer-chevron-up
    initial: *heat_morning

  climate_heat_day:
    name: "Climate Heat - Daytime"
    min: 60
    max: 80
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer
    initial: *heat_day

  climate_heat_bedtime:
    name: "Climate Heat - Bedtime"
    min: 60
    max: 80
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer-chevron-up
    initial: *heat_bedtime

  climate_heat_sleep:
    name: "Climate Heat - Sleep"
    min: 60
    max: 80
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer-chevron-down
    initial: *heat_sleep

  climate_heat_away:
    name: "Climate Heat - Away"
    min: 55
    max: 75
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer-low
    initial: *heat_away

  climate_cool_morning:
    name: "Climate Cool - Morning"
    min: 65
    max: 85
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:snowflake
    initial: *cool_morning

  climate_cool_day:
    name: "Climate Cool - Daytime"
    min: 65
    max: 85
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:snowflake
    initial: *cool_day

  climate_cool_bedtime:
    name: "Climate Cool - Bedtime"
    min: 65
    max: 85
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:snowflake
    initial: *cool_bedtime

  climate_cool_sleep:
    name: "Climate Cool - Sleep"
    min: 65
    max: 85
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:snowflake
    initial: *cool_sleep

  climate_cool_away:
    name: "Climate Cool - Away"
    min: 70
    max: 85
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:snowflake-thermometer
    initial: *cool_away

  climate_extreme_heat_threshold:
    name: "Climate Extreme Heat Threshold"
    min: 85
    max: 110
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer-alert
    initial: 95

  climate_extreme_heat_precool_offset:
    name: "Climate Extreme Heat Pre-cool Offset"
    min: 0
    max: 2
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:snowflake-thermometer
    initial: 1

# State tracking helpers
input_boolean:
  climate_automation_enabled:
    name: "Climate Automation"
    icon: mdi:thermostat-auto
    initial: true

  climate_extreme_heat_overlay_enabled:
    name: "Climate Extreme Heat Overlay"
    icon: mdi:sun-thermometer
    initial: true

  climate_extreme_heat_precool_active:
    name: "Climate Extreme Heat Pre-cool Active"
    icon: mdi:snowflake-alert
    initial: false

template:
  - binary_sensor:
      - name: "Climate Extreme Heat Day"
        unique_id: climate_extreme_heat_day
        icon: mdi:sun-thermometer
        availability: >
          {% set daily_state = states('sensor.weather_daily_forecast') %}
          {% set threshold = states('input_number.climate_extreme_heat_threshold') | float(none) %}
          {{ daily_state not in ['unknown', 'unavailable', '', none] and threshold is not none }}
        state: >
          {#
            NWS twice-daily forecast periods in this deployment expose
            temperature values in Fahrenheit. Use the normalized forecast
            attribute directly instead of the older derived high-temp helper
            so the hot-day decision is not dependent on ambiguous units.
          #}
          {% set threshold = states('input_number.climate_extreme_heat_threshold') | float(95) %}
          {% set source_entity = state_attr('sensor.weather_daily_forecast', 'source_entity') | default('weather.nws_home_kmle', true) %}
          {% set direct_forecast = state_attr('sensor.weather_daily_forecast', 'forecast') %}
          {% set source_payload = state_attr('sensor.weather_daily_forecast', source_entity) %}
          {% set forecast = direct_forecast if direct_forecast is not none else source_payload.forecast if source_payload is mapping and source_payload.forecast is defined else [] %}
          {% set ns = namespace(high=none) %}
          {% for period in forecast[:2] %}
            {% set temp = period.temperature | float(none) %}
            {% if temp is not none and (ns.high is none or temp > ns.high) %}
              {% set ns.high = temp %}
            {% endif %}
          {% endfor %}
          {{ ns.high is not none and ns.high >= threshold }}
        attributes:
          forecast_high_f: >
            {% set source_entity = state_attr('sensor.weather_daily_forecast', 'source_entity') | default('weather.nws_home_kmle', true) %}
            {% set direct_forecast = state_attr('sensor.weather_daily_forecast', 'forecast') %}
            {% set source_payload = state_attr('sensor.weather_daily_forecast', source_entity) %}
            {% set forecast = direct_forecast if direct_forecast is not none else source_payload.forecast if source_payload is mapping and source_payload.forecast is defined else [] %}
            {% set ns = namespace(high=none) %}
            {% for period in forecast[:2] %}
              {% set temp = period.temperature | float(none) %}
              {% if temp is not none and (ns.high is none or temp > ns.high) %}
                {% set ns.high = temp %}
              {% endif %}
            {% endfor %}
            {{ ns.high if ns.high is not none else 'unknown' }}
          threshold_f: "{{ states('input_number.climate_extreme_heat_threshold') | float(95) }}"
          forecast_source: "sensor.weather_daily_forecast"
          forecast_unit_assumption: "NWS forecast temperature attribute is Fahrenheit"
          decision_scope: "maximum temperature from the first two twice-daily periods"

# Automations
automation:
  # ============================================================================
  # TIME-BASED SCHEDULE AUTOMATIONS
  # ============================================================================

  - alias: "climate_schedule_morning_weekday"
    id: "climate_schedule_morning_weekday"
    description: "Set morning temperature for weekdays (Mon-Fri)"
    trigger:
      - platform: time
        at: "05:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
      - condition: time
        weekday:
          - mon
          - tue
          - wed
          - thu
          - fri
      - condition: or
        conditions:
          - condition: numeric_state
            entity_id: zone.home
            above: 0
          - condition: state
            entity_id: input_boolean.mode_guest
            state: "on"
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      - service: climate.set_temperature
        target:
          entity_id: climate.dining_room_thermostat
        data:
          target_temp_high: >
            {{ states('input_number.climate_cool_morning') | float }}
          target_temp_low: >
            {{ states('input_number.climate_heat_morning') | float }}

  - alias: "climate_schedule_morning_weekend"
    id: "climate_schedule_morning_weekend"
    description: "Set morning temperature for weekends (Sat-Sun)"
    trigger:
      - platform: time
        at: "07:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
      - condition: time
        weekday:
          - sat
          - sun
      - condition: or
        conditions:
          - condition: numeric_state
            entity_id: zone.home
            above: 0
          - condition: state
            entity_id: input_boolean.mode_guest
            state: "on"
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      - service: climate.set_temperature
        target:
          entity_id: climate.dining_room_thermostat
        data:
          target_temp_high: >
            {{ states('input_number.climate_cool_morning') | float }}
          target_temp_low: >
            {{ states('input_number.climate_heat_morning') | float }}

  - alias: "climate_schedule_day"
    id: "climate_schedule_day"
    description: "Set daytime temperature (all days)"
    trigger:
      - platform: time
        at: "09:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
      - condition: or
        conditions:
          - condition: numeric_state
            entity_id: zone.home
            above: 0
          - condition: state
            entity_id: input_boolean.mode_guest
            state: "on"
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      - service: climate.set_temperature
        target:
          entity_id: climate.dining_room_thermostat
        data:
          target_temp_high: >
            {{ states('input_number.climate_cool_day') | float }}
          target_temp_low: >
            {{ states('input_number.climate_heat_day') | float }}

  - alias: "climate_extreme_heat_precool_apply"
    id: "climate_extreme_heat_precool_apply"
    description: >
      Apply a one-time daytime cooling offset on validated extreme-heat days.
    trigger:
      - platform: time
        at: "13:00:00"
        id: overlay_window_start
      - platform: state
        entity_id: binary_sensor.climate_extreme_heat_day
        to: "on"
        id: hot_day_detected
      - platform: state
        entity_id: input_boolean.mode_guest
        to: "on"
        id: guest_mode_enabled
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.climate_extreme_heat_overlay_enabled
        state: "on"
      - condition: state
        entity_id: binary_sensor.climate_extreme_heat_day
        state: "on"
      - condition: state
        entity_id: input_boolean.climate_extreme_heat_precool_active
        state: "off"
      - condition: time
        after: "12:59:00"
        before: "18:00:00"
      # Not away: someone is home, or guest mode is intentionally preserving
      # occupied-house behavior while residents may be absent.
      - condition: or
        conditions:
          - condition: numeric_state
            entity_id: zone.home
            above: 0
          - condition: state
            entity_id: input_boolean.mode_guest
            state: "on"
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      - service: climate.set_temperature
        target:
          entity_id: climate.dining_room_thermostat
        data:
          target_temp_high: >
            {% set day = states('input_number.climate_cool_day') | float %}
            {% set offset = states('input_number.climate_extreme_heat_precool_offset') | float(1) %}
            {{ [day - offset, 65] | max }}
          target_temp_low: >
            {{ states('input_number.climate_heat_day') | float }}
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.climate_extreme_heat_precool_active
    mode: single

  - alias: "climate_extreme_heat_precool_restore"
    id: "climate_extreme_heat_precool_restore"
    description: >
      End the bounded extreme-heat pre-cool overlay and restore daytime targets.
    trigger:
      - platform: time
        at: "18:00:00"
        id: overlay_window_end
      - platform: state
        entity_id: input_boolean.climate_extreme_heat_overlay_enabled
        to: "off"
        id: overlay_disabled
      - platform: state
        entity_id: input_boolean.climate_automation_enabled
        to: "off"
        id: climate_disabled
      - platform: numeric_state
        entity_id: zone.home
        below: 1
        for:
          minutes: 5
        id: away_started
    condition:
      - condition: state
        entity_id: input_boolean.climate_extreme_heat_precool_active
        state: "on"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.climate_extreme_heat_precool_active
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id != 'away_started' }}"
              - condition: state
                entity_id: input_boolean.climate_automation_enabled
                state: "on"
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity_id: zone.home
                    above: 0
                  - condition: state
                    entity_id: input_boolean.mode_guest
                    state: "on"
              - condition: time
                after: "09:00:00"
                before: "21:00:00"
            sequence:
              - service: climate.set_hvac_mode
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  hvac_mode: heat_cool
              - service: climate.set_temperature
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  target_temp_high: >
                    {{ states('input_number.climate_cool_day') | float }}
                  target_temp_low: >
                    {{ states('input_number.climate_heat_day') | float }}
    mode: single

  - alias: "climate_schedule_bedtime"
    id: "climate_schedule_bedtime"
    description: "Set bedtime comfort temperature (all days)"
    trigger:
      - platform: time
        at: "21:00:00"
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
      - condition: or
        conditions:
          - condition: numeric_state
            entity_id: zone.home
            above: 0
          - condition: state
            entity_id: input_boolean.mode_guest
            state: "on"
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      - service: climate.set_temperature
        target:
          entity_id: climate.dining_room_thermostat
        data:
          target_temp_high: >
            {{ states('input_number.climate_cool_bedtime') | float }}
          target_temp_low: >
            {{ states('input_number.climate_heat_bedtime') | float }}

  - alias: "climate_schedule_sleep"
    id: "climate_schedule_sleep"
    description: "Set sleep temperature (all days)"
    trigger:
      - platform: time
        at: "22:30:00"
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
      - condition: or
        conditions:
          - condition: numeric_state
            entity_id: zone.home
            above: 0
          - condition: state
            entity_id: input_boolean.mode_guest
            state: "on"
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      - service: climate.set_temperature
        target:
          entity_id: climate.dining_room_thermostat
        data:
          target_temp_high: >
            {{ states('input_number.climate_cool_sleep') | float }}
          target_temp_low: >
            {{ states('input_number.climate_heat_sleep') | float }}

  # ============================================================================
  # PRESENCE-BASED AUTOMATIONS
  # ============================================================================

  - alias: "climate_away_mode_activate"
    id: "climate_away_mode_activate"
    description: "Activate energy-saving temps when everyone leaves"
    trigger:
      - platform: numeric_state
        entity_id: zone.home
        below: 1
        for:
          minutes: 5
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
      # Don't activate away mode if guest mode is on
      - condition: state
        entity_id: input_boolean.mode_guest
        state: "off"
    action:
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      - service: climate.set_temperature
        target:
          entity_id: climate.dining_room_thermostat
        data:
          target_temp_high: >
            {{ states('input_number.climate_cool_away') | float }}
          target_temp_low: >
            {{ states('input_number.climate_heat_away') | float }}

  - alias: "climate_away_mode_deactivate"
    id: "climate_away_mode_deactivate"
    description: "Resume schedule when someone returns home"
    trigger:
      - platform: numeric_state
        entity_id: zone.home
        above: 0
    condition:
      - condition: state
        entity_id: input_boolean.climate_automation_enabled
        state: "on"
    action:
      # Ensure heat_cool mode first
      - service: climate.set_hvac_mode
        target:
          entity_id: climate.dining_room_thermostat
        data:
          hvac_mode: heat_cool
      # Determine which schedule to resume based on current time
      - choose:
          # Morning (5:00-8:59 weekdays, 7:00-8:59 weekends)
          - conditions:
              - condition: or
                conditions:
                  - condition: and
                    conditions:
                      - condition: time
                        after: "05:00:00"
                        before: "09:00:00"
                      - condition: time
                        weekday:
                          - mon
                          - tue
                          - wed
                          - thu
                          - fri
                  - condition: and
                    conditions:
                      - condition: time
                        after: "07:00:00"
                        before: "09:00:00"
                      - condition: time
                        weekday:
                          - sat
                          - sun
            sequence:
              - service: climate.set_temperature
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  target_temp_high: >
                    {{ states('input_number.climate_cool_morning') | float }}
                  target_temp_low: >
                    {{ states('input_number.climate_heat_morning') | float }}
          # Extreme heat overlay window (13:00-17:59). Handle return-home here
          # instead of in a second zone.home automation so this path is not
          # order-dependent with the normal daytime restore.
          - conditions:
              - condition: state
                entity_id: input_boolean.climate_extreme_heat_overlay_enabled
                state: "on"
              - condition: state
                entity_id: binary_sensor.climate_extreme_heat_day
                state: "on"
              - condition: time
                after: "12:59:00"
                before: "18:00:00"
            sequence:
              - service: climate.set_temperature
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  target_temp_high: >
                    {% set day = states('input_number.climate_cool_day') | float %}
                    {% set offset = states('input_number.climate_extreme_heat_precool_offset') | float(1) %}
                    {{ [day - offset, 65] | max }}
                  target_temp_low: >
                    {{ states('input_number.climate_heat_day') | float }}
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.climate_extreme_heat_precool_active
          # Daytime (9:00-20:59)
          - conditions:
              - condition: time
                after: "09:00:00"
                before: "21:00:00"
            sequence:
              - service: climate.set_temperature
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  target_temp_high: >
                    {{ states('input_number.climate_cool_day') | float }}
                  target_temp_low: >
                    {{ states('input_number.climate_heat_day') | float }}
          # Bedtime (21:00-22:29)
          - conditions:
              - condition: time
                after: "21:00:00"
                before: "22:30:00"
            sequence:
              - service: climate.set_temperature
                target:
                  entity_id: climate.dining_room_thermostat
                data:
                  target_temp_high: >
                    {{ states('input_number.climate_cool_bedtime') | float }}
                  target_temp_low: >
                    {{ states('input_number.climate_heat_bedtime') | float }}
        # Default: Sleep temps (22:30-04:59)
        default:
          - service: climate.set_temperature
            target:
              entity_id: climate.dining_room_thermostat
            data:
              target_temp_high: >
                {{ states('input_number.climate_cool_sleep') | float }}
              target_temp_low: >
                {{ states('input_number.climate_heat_sleep') | float }}
