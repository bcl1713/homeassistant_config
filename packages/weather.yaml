# packages/weather.yaml
#
# Weather information management with efficient triggers and caching
#
# Features:
# - Event-based triggers instead of time-pattern polling
# - Cache NWS forecasts to reduce API calls
# - Maintain normalized forecast predictions for the next hour and day/night period
#
# NWS source entities verified from the live integration:
# - weather.nws_home_kmle
# - sensor.nws_41_17166991853366_96_04711058392532_kmle_temperature
# - sensor.nws_41_17166991853366_96_04711058392532_kmle_relative_humidity
# - sensor.nws_41_17166991853366_96_04711058392532_kmle_dew_point
# If the auxiliary NWS current-condition sensors are disabled in HA, enable them
# before expecting the normalized current-condition seam below to populate.

# Input variables for controlling refresh frequency
input_number:
  weather_update_frequency:
    name: "Weather Update Frequency"
    min: 15
    max: 180
    step: 15
    unit_of_measurement: "minutes"
    icon: mdi:clock-outline
    initial: 30

homeassistant:
  customize:
    package.node_anchors:
      rain_window_contacts: &rain_window_contacts
        binary_sensor.kitchen_kitchen_porch_window: "Kitchen Porch Window"
        binary_sensor.kitchen_kitchen_sink_window: "Kitchen Sink Window"
        binary_sensor.living_room_living_room_window: "Living Room Window"
        binary_sensor.master_bedroom_brian_s_window: "Brian's Window"
        binary_sensor.master_bedroom_hester_s_window: "Hester's Window"
        binary_sensor.porter_s_room_porter_s_window: "Porter's Window"
        binary_sensor.towner_s_room_towner_s_window: "Towner's Window"
        binary_sensor.office_window: "Office Window"

automation:
  - alias: "Rain Forecast Alert"
    id: "notification_rain_forecast"
    description: >
      NWS-backed rain probability and condition notification for monitored open
      windows, with a tagged clear once every monitored window is closed.
    variables:
      rain_window_contacts: *rain_window_contacts
      open_window_names: >
        {% set windows = namespace(names=[]) %}
        {% for entity_id, name in rain_window_contacts.items() %}
          {% if is_state(entity_id, 'on') %}
            {% set windows.names = windows.names + [name] %}
          {% endif %}
        {% endfor %}
        {{ windows.names | join(', ') }}
      forecast_basis: >
        {% set probability = states('sensor.precipitation_forecast_next_hour') | float(0) %}
        {% set condition = states('sensor.condition_forecast_next_hour') %}
        {% if probability > 30 %}
          {{ probability | round(0) }}% chance of precipitation in the next hour
        {% elif condition in ['rainy', 'pouring', 'snowy', 'snowy-rainy'] %}
          {{ condition | title }} conditions expected in the next hour
        {% else %}
          {{ states('weather.nws_home_kmle') | title }} conditions expected
        {% endif %}
    trigger:
      # Primary: NWS precipitation probability sensor (percent chance)
      - platform: numeric_state
        entity_id: sensor.precipitation_forecast_next_hour
        above: 30
        id: "precipitation_probability_trigger"
      # Backup: Condition-based detection
      - platform: state
        entity_id: sensor.condition_forecast_next_hour
        to:
          - "rainy"
          - "pouring"
          - "snowy"
          - "snowy-rainy"
        id: "condition_trigger"
      # Fallback: Main NWS weather entity
      - platform: state
        entity_id: weather.nws_home_kmle
        to:
          - "rainy"
          - "pouring"
          - "snowy"
          - "snowy-rainy"
        id: "weather_fallback"
      # Re-check an already-rainy forecast if a monitored window is opened.
      - platform: state
        entity_id:
          - binary_sensor.kitchen_kitchen_porch_window
          - binary_sensor.kitchen_kitchen_sink_window
          - binary_sensor.living_room_living_room_window
          - binary_sensor.master_bedroom_brian_s_window
          - binary_sensor.master_bedroom_hester_s_window
          - binary_sensor.porter_s_room_porter_s_window
          - binary_sensor.towner_s_room_towner_s_window
          - binary_sensor.office_window
        from: "off"
        to: "on"
        id: "window_open_trigger"
    condition:
      # Wait for weather data to be available after startup
      - condition: template
        value_template: >
          {% set sensor_state = states('sensor.weather_hourly_forecast') %}
          {% set invalid_states = ['unknown', 'unavailable', '', none] %}
          {{ sensor_state not in invalid_states }}
      # Only notify during reasonable hours
      - condition: time
        after: "05:00:00"
        before: "22:00:00"
      # A contact opening re-checks the same near-term criteria as the weather
      # triggers, so a dry forecast can never produce an open-window alert.
      - condition: template
        value_template: >
          {% set probability = states('sensor.precipitation_forecast_next_hour') | float(0) %}
          {% set condition = states('sensor.condition_forecast_next_hour') %}
          {% set weather_condition = states('weather.nws_home_kmle') %}
          {{ probability > 30 or
             condition in ['rainy', 'pouring', 'snowy', 'snowy-rainy'] or
             weather_condition in ['rainy', 'pouring', 'snowy', 'snowy-rainy'] }}
      # Alert only while at least one configured window contact is open.
      - condition: template
        value_template: "{{ open_window_names | trim != '' }}"
      # Avoid spam - only if no recent notification
      - condition: template
        value_template: >
          {% set last_triggered = state_attr('automation.notification_rain_forecast', 'last_triggered') %}
          {% if last_triggered is none %}
            true
          {% else %}
            {{ (now() - last_triggered).total_seconds() > 3600 }}
          {% endif %}
    action:
      - action: notify.mobile_app_brian_phone
        data:
          message: >
            ☔ Close {{ open_window_names }}: {{ forecast_basis }}.
          title: "Rain Alert: Open Windows"
          data:
            tag: "rain-open-windows"
    mode: single

  - alias: "Rain Forecast Open Windows Clear"
    id: "notification_rain_forecast_open_windows_clear"
    description: >
      Clear the rain open-window alert only after every monitored window is
      closed; closing one of several open windows leaves the alert visible.
    variables:
      rain_window_contacts: *rain_window_contacts
      has_open_windows: >
        {% for entity_id in rain_window_contacts %}
          {% if is_state(entity_id, 'on') %}
            true
          {% endif %}
        {% endfor %}
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.kitchen_kitchen_porch_window
          - binary_sensor.kitchen_kitchen_sink_window
          - binary_sensor.living_room_living_room_window
          - binary_sensor.master_bedroom_brian_s_window
          - binary_sensor.master_bedroom_hester_s_window
          - binary_sensor.porter_s_room_porter_s_window
          - binary_sensor.towner_s_room_towner_s_window
          - binary_sensor.office_window
        from: "on"
        to: "off"
    condition:
      - condition: template
        value_template: "{{ not has_open_windows }}"
    action:
      - action: notify.mobile_app_brian_phone
        data:
          message: "clear_notification"
          data:
            tag: "rain-open-windows"
    mode: single

  - alias: "weather_data_refresh"
    id: "weather_data_refresh"
    description: "Update NWS-backed normalized weather data"
    trigger:
      # Time-based backup trigger (fixed at 15 minutes)
      - platform: time_pattern
        minutes: "/15"
      # Event-based trigger for weather alerts
      - platform: state
        entity_id: weather.nws_home_kmle
        attribute: weather_alert
        to: "true"
    condition:
      # Only update if enough time has passed according to the user setting
      - condition: template
        value_template: >
          {% set last_updated = states('sensor.weather_last_updated') %}
          {% set min_interval = states('input_number.weather_update_frequency') | int %}
          {% set invalid_states = ['unknown', 'unavailable', '', none] %}
          {% if last_updated in invalid_states %}
            true
          {% else %}
            {% set time_diff = (now().timestamp() - as_timestamp(last_updated)) / 60 %}
            {{ time_diff > min_interval }}
          {% endif %}
    action:
      # Get the NWS hourly forecast
      - service: weather.get_forecasts
        data:
          type: hourly
        target:
          entity_id: weather.nws_home_kmle
        response_variable: hourly_forecast

      # NWS supports twice_daily in this deployment; daily returns 500.
      - service: weather.get_forecasts
        data:
          type: twice_daily
        target:
          entity_id: weather.nws_home_kmle
        response_variable: twice_daily_forecast

      # Publish normalized forecast data to MQTT topics. weather.get_forecasts
      # returns a response keyed by source entity; downstream sensors should only
      # depend on this package's stable top-level forecast attribute.
      - service: mqtt.publish
        data:
          topic: "home/weather/hourly_forecast"
          payload: >
            {% set source = 'weather.nws_home_kmle' %}
            {% set payload = hourly_forecast.get(source, {}) if hourly_forecast is defined and hourly_forecast is mapping else {} %}
            {% set forecast = payload.get('forecast', []) if payload is mapping else [] %}
            {{ {
              'source_entity': source,
              'forecast_type': 'hourly',
              'retrieved_at': now().isoformat(),
              'forecast_count': forecast | count,
              'forecast': forecast,
            } | tojson }}

      - service: mqtt.publish
        data:
          topic: "home/weather/daily_forecast"
          payload: >
            {% set source = 'weather.nws_home_kmle' %}
            {% set payload = twice_daily_forecast.get(source, {}) if twice_daily_forecast is defined and twice_daily_forecast is mapping else {} %}
            {% set forecast = payload.get('forecast', []) if payload is mapping else [] %}
            {{ {
              'source_entity': source,
              'forecast_type': 'twice_daily',
              'retrieved_at': now().isoformat(),
              'forecast_count': forecast | count,
              'forecast': forecast,
            } | tojson }}
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.weather_last_updated
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

# Helper entity to track last update time
input_datetime:
  weather_last_updated:
    name: "Weather Last Updated"
    has_date: true
    has_time: true

# MQTT sensors for storing forecast data
mqtt:
  sensor:
    - name: "Weather Hourly Forecast"
      state_topic: "home/weather/hourly_forecast"
      value_template: "{{ now().isoformat() }}"
      json_attributes_topic: "home/weather/hourly_forecast"
      unique_id: "weather_hourly_forecast"

    - name: "Weather Daily Forecast"
      state_topic: "home/weather/daily_forecast"
      value_template: "{{ now().isoformat() }}"
      json_attributes_topic: "home/weather/daily_forecast"
      unique_id: "weather_daily_forecast"

template:
  - sensor:
      - name: "Weather Last Updated"
        unique_id: weather_last_updated
        state: "{{ states('input_datetime.weather_last_updated') | default('unknown') }}"

      - name: "Weather Outdoor Temperature"
        unique_id: weather_outdoor_temperature
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        availability: >
          {% set value = states('sensor.nws_41_17166991853366_96_04711058392532_kmle_temperature') %}
          {{ value not in ['unknown', 'unavailable', '', none] }}
        state: >
          {{ states('sensor.nws_41_17166991853366_96_04711058392532_kmle_temperature') | float(none) | round(1) }}

      - name: "Weather Outdoor Humidity"
        unique_id: weather_outdoor_humidity
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        availability: >
          {% set value = states('sensor.nws_41_17166991853366_96_04711058392532_kmle_relative_humidity') %}
          {{ value not in ['unknown', 'unavailable', '', none] }}
        state: >
          {{ states('sensor.nws_41_17166991853366_96_04711058392532_kmle_relative_humidity') | float(none) | round(0) }}

      - name: "Weather Outdoor Dew Point"
        unique_id: weather_outdoor_dew_point
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        availability: >
          {% set value = states('sensor.nws_41_17166991853366_96_04711058392532_kmle_dew_point') %}
          {{ value not in ['unknown', 'unavailable', '', none] }}
        state: >
          {{ states('sensor.nws_41_17166991853366_96_04711058392532_kmle_dew_point') | float(none) | round(1) }}

      - name: "Condition forecast next hour"
        unique_id: weather_forecast_condition_next_hour
        state: >
          {% set sensor_state = states('sensor.weather_hourly_forecast') %}
          {% set invalid_states = ['unknown', 'unavailable', '', none] %}
          {% set source_entity = state_attr('sensor.weather_hourly_forecast', 'source_entity') | default('weather.nws_home_kmle', true) %}
          {% if sensor_state not in invalid_states %}
            {% set direct_forecast = state_attr('sensor.weather_hourly_forecast', 'forecast') %}
            {% set source_payload = state_attr('sensor.weather_hourly_forecast', source_entity) %}
            {% set forecast = direct_forecast if direct_forecast is not none else source_payload.forecast if source_payload is mapping and source_payload.forecast is defined else [] %}
            {% if forecast is defined and forecast is not none and forecast | length > 0 %}
              {{ forecast[0].condition | default('unknown') }}
            {% else %}
              {{ states('weather.nws_home_kmle') | default('unknown') }}
            {% endif %}
          {% else %}
            {{ states('weather.nws_home_kmle') | default('unknown') }}
          {% endif %}

      - name: "Condition forecast today"
        unique_id: weather_forecast_condition_today
        state: >
          {% set sensor_state = states('sensor.weather_daily_forecast') %}
          {% set invalid_states = ['unknown', 'unavailable', '', none] %}
          {% set source_entity = state_attr('sensor.weather_daily_forecast', 'source_entity') | default('weather.nws_home_kmle', true) %}
          {% if sensor_state not in invalid_states %}
            {% set direct_forecast = state_attr('sensor.weather_daily_forecast', 'forecast') %}
            {% set source_payload = state_attr('sensor.weather_daily_forecast', source_entity) %}
            {% set forecast = direct_forecast if direct_forecast is not none else source_payload.forecast if source_payload is mapping and source_payload.forecast is defined else [] %}
            {% if forecast is defined and forecast is not none and forecast | length > 0 %}
              {{ forecast[0].condition | default('unknown') }}
            {% else %}
              {{ states('weather.nws_home_kmle') | default('unknown') }}
            {% endif %}
          {% else %}
            {{ states('weather.nws_home_kmle') | default('unknown') }}
          {% endif %}

      - name: "Precipitation forecast next hour"
        unique_id: weather_forecast_precipitation_next_hour
        state: >
          {% set sensor_state = states('sensor.weather_hourly_forecast') %}
          {% set invalid_states = ['unknown', 'unavailable', '', none] %}
          {% set source_entity = state_attr('sensor.weather_hourly_forecast', 'source_entity') | default('weather.nws_home_kmle', true) %}
          {% if sensor_state not in invalid_states %}
            {% set direct_forecast = state_attr('sensor.weather_hourly_forecast', 'forecast') %}
            {% set source_payload = state_attr('sensor.weather_hourly_forecast', source_entity) %}
            {% set forecast = direct_forecast if direct_forecast is not none else source_payload.forecast if source_payload is mapping and source_payload.forecast is defined else [] %}
            {% if forecast is defined and forecast is not none and forecast | length > 0 %}
              {{ forecast[0].precipitation_probability | default(0) | float(0) | round(0) }}
            {% else %}
              0
            {% endif %}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "%"

      - name: "Temperature forecast high today"
        unique_id: weather_forecast_temperature_high_today
        availability: >
          {% set sensor_state = states('sensor.weather_daily_forecast') %}
          {% set invalid_states = ['unknown', 'unavailable', '', none] %}
          {% set source_entity = state_attr('sensor.weather_daily_forecast', 'source_entity') | default('weather.nws_home_kmle', true) %}
          {% set direct_forecast = state_attr('sensor.weather_daily_forecast', 'forecast') %}
          {% set source_payload = state_attr('sensor.weather_daily_forecast', source_entity) %}
          {% set forecast = direct_forecast if direct_forecast is not none else source_payload.forecast if source_payload is mapping and source_payload.forecast is defined else [] %}
          {% set ns = namespace(high=none) %}
          {% if sensor_state not in invalid_states %}
            {% for period in forecast[:2] %}
              {% set temp = period.temperature | float(none) %}
              {% if temp is not none and (ns.high is none or temp > ns.high) %}
                {% set ns.high = temp %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.high is not none }}
        state: >
          {% set source_entity = state_attr('sensor.weather_daily_forecast', 'source_entity') | default('weather.nws_home_kmle', true) %}
          {% set direct_forecast = state_attr('sensor.weather_daily_forecast', 'forecast') %}
          {% set source_payload = state_attr('sensor.weather_daily_forecast', source_entity) %}
          {% set forecast = direct_forecast if direct_forecast is not none else source_payload.forecast if source_payload is mapping and source_payload.forecast is defined else [] %}
          {% set ns = namespace(high=none) %}
          {% for period in forecast[:2] %}
            {% set temp = period.temperature | float(none) %}
            {% if temp is not none and (ns.high is none or temp > ns.high) %}
              {% set ns.high = temp %}
            {% endif %}
          {% endfor %}
          {{ ns.high | round(1) if ns.high is not none else 'unknown' }}
        attributes:
          forecast_source: "sensor.weather_daily_forecast"
          forecast_unit_assumption: "NWS forecast temperature attribute is Fahrenheit"
          decision_scope: "maximum temperature from the first two twice-daily periods"
        unit_of_measurement: "°F"
        device_class: temperature
