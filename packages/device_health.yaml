# packages/device_health.yaml
#
# Device Health Monitoring Package
#
# Features:
# - Enhanced battery monitoring with proactive alerts
# - Device health trend analysis
# - Maintenance scheduling and tracking
# - Integration with existing brief system
#
# This package enhances the existing brief system's device monitoring
# without breaking existing functionality.

homeassistant:
  customize:
    package.node_anchors:
      critical_battery_threshold: &critical_threshold 15
      warning_battery_threshold: &warning_threshold 30
      low_battery_threshold: &low_threshold 5

input_boolean:
  device_health_monitoring_enabled:
    name: "Device Health Monitoring"
    icon: mdi:heart-pulse
    initial: true

  device_health_proactive_alerts:
    name: "Proactive Battery Alerts"
    icon: mdi:battery-alert
    initial: true

  device_health_critical_alert_sent:
    name: "Critical Battery Alert Status"
    icon: mdi:battery-10
    initial: false

  device_connectivity_monitoring_enabled:
    name: "Device Connectivity Monitoring"
    icon: mdi:access-point-network
    initial: true

  device_connectivity_alerts_enabled:
    name: "Device Connectivity Alerts"
    icon: mdi:network-alert
    initial: true

  device_connectivity_alert_sent:
    name: "Device Connectivity Alert Status"
    icon: mdi:bell-ring
    initial: false

input_number:
  device_health_critical_threshold:
    name: "Critical Battery Threshold"
    min: 5
    max: 75
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-20
    initial: *critical_threshold

  device_health_warning_threshold:
    name: "Warning Battery Threshold"
    min: 10
    max: 50
    step: 5
    unit_of_measurement: "%"
    icon: mdi:battery-30
    initial: *warning_threshold

  device_health_low_threshold:
    name: "Low Battery Threshold"
    min: 1
    max: 10
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-alert-variant-outline
    initial: *low_threshold

  device_connectivity_last_seen_threshold_hours:
    name: "Device Connectivity Last Seen Threshold"
    min: 1
    max: 168
    step: 1
    unit_of_measurement: "hours"
    icon: mdi:clock-alert-outline
    initial: 24

template:
  - sensor:
      - name: "Real-time Battery Levels"
        unique_id: realtime_battery_levels
        state: >
          {% set ns = namespace(count=0) %}
          {% for entity in states if entity.attributes.battery_level is defined %}
            {% set level = entity.attributes.battery_level | float(-1) | int %}
            {% if level >= 0 %}
              {% set ns.count = ns.count + 1 %}
            {% endif %}
          {% endfor %}
          {% for entity in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
            {% if entity.state | string | regex_match('^[0-9.]+$') %}
              {% set level = entity.state | int %}
              {% if 0 <= level <= 100 %}
                {% if not entity.entity_id.startswith('sensor.device_health_') and 
                      not entity.entity_id.startswith('sensor.battery_') and
                      entity.entity_id != 'sensor.real_time_battery_levels' %}
                  {% set ns.count = ns.count + 1 %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.count }}
        unit_of_measurement: "devices"
        attributes:
          critical_count: >
            {% set ns = namespace(count=0) %}
            {% set threshold = states('input_number.device_health_critical_threshold') | int(15) %}
            {% for entity in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
              {% if entity.state | string | regex_match('^[0-9.]+$') %}
                {% set level = entity.state | int %}
                {% if 0 <= level <= threshold %}
                  {% if not entity.entity_id.startswith('sensor.device_health_') and 
                        not entity.entity_id.startswith('sensor.battery_') and
                        entity.entity_id != 'sensor.real_time_battery_levels' %}
                    {% set ns.count = ns.count + 1 %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.count }}

          warning_count: >
            {% set ns = namespace(count=0) %}
            {% set threshold = states('input_number.device_health_warning_threshold') | int(30) %}
            {% for entity in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
              {% if entity.state | string | regex_match('^[0-9.]+$') %}
                {% set level = entity.state | int %}
                {% if 0 <= level <= threshold %}
                  {% if not entity.entity_id.startswith('sensor.device_health_') and 
                        not entity.entity_id.startswith('sensor.battery_') and
                        entity.entity_id != 'sensor.real_time_battery_levels' %}
                    {% set ns.count = ns.count + 1 %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.count }}

          lowest_battery: >
            {% set ns = namespace(lowest=999, name='') %}
            {% for entity in states.sensor | selectattr('attributes.device_class', '==', 'battery') %}
              {% if entity.state | string | regex_match('^[0-9.]+$') %}
                {% set level = entity.state | int %}
                {% if 0 <= level <= 100 %}
                  {% if not entity.entity_id.startswith('sensor.device_health_') and 
                        not entity.entity_id.startswith('sensor.battery_') and
                        entity.entity_id != 'sensor.real_time_battery_levels' %}
                    {% if level < ns.lowest %}
                      {% set ns.lowest = level %}
                      {% set ns.name = entity.name or entity.entity_id %}
                    {% endif %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% if ns.name %}
              {{ ns.name }}: {{ ns.lowest }}%
            {% else %}
              "No batteries found"
            {% endif %}

      - name: "Device Health Battery Summary"
        unique_id: device_health_battery_summary
        state: >
          {% set device_data = state_attr('sensor.brief_data_devices', 'battery_summary') %}
          {% if device_data %}
            {{ device_data.total_discovered }}
          {% else %}
            0
          {% endif %}
        attributes:
          total_batteries: >
            {% set device_data = state_attr('sensor.brief_data_devices', 'battery_summary') %}
            {{ device_data.total_discovered if device_data else 0 }}
          critical_count: >
            {% set devices = state_attr('sensor.brief_data_devices', 'critical_batteries') %}
            {{ devices | length if devices else 0 }}
          warning_count: >
            {% set devices = state_attr('sensor.brief_data_devices', 'warning_batteries') %}
            {% if devices %}
              {{ devices | length }}
            {% else %}
              0
            {% endif %}
          lowest_battery: >
            {% set device_data = state_attr('sensor.brief_data_devices', 'battery_summary') %}
            {% if device_data and device_data.lowest_battery %}
              {{ device_data.lowest_battery.name }}: {{ device_data.lowest_battery.level }}%
            {% else %}
              "All batteries healthy"
            {% endif %}
          charging_devices: >
            {% set device_data = state_attr('sensor.brief_data_devices', 'battery_summary') %}
            {% if device_data and device_data.charging_devices %}
              {{ device_data.charging_devices | map(attribute='name') | list | join(', ') }}
            {% else %}
              "None"
            {% endif %}

      - name: "Device Health Critical Devices"
        unique_id: device_health_critical_devices
        state: >
          {% set devices = state_attr('sensor.brief_data_devices', 'critical_batteries') %}
          {% set critical_threshold = states('input_number.device_health_critical_threshold') | int(15) %}
          {% set critical_devices = devices | selectattr('level', '<=', critical_threshold) | list if devices else [] %}
          {{ critical_devices | length }}
        attributes:
          critical_threshold: >
            {{ states('input_number.device_health_critical_threshold') | int(15) }}
          devices: >
            {% set devices = state_attr('sensor.brief_data_devices', 'critical_batteries') %}
            {% set critical_threshold = states('input_number.device_health_critical_threshold') | int(15) %}
            {% set critical_devices = devices | selectattr('level', '<=', critical_threshold) | list if devices else [] %}
            {{ critical_devices }}
          domains_affected: >
            {% set devices = state_attr('sensor.brief_data_devices', 'critical_batteries') %}
            {% set critical_threshold = states('input_number.device_health_critical_threshold') | int(15) %}
            {% set critical_devices = devices | selectattr('level', '<=', critical_threshold) | list if devices else [] %}
            {% set domains = critical_devices | map(attribute='domain') | unique | list %}
            {{ domains | join(', ') if domains else 'None' }}

  - binary_sensor:
      - name: "Device Health Has Critical Batteries"
        unique_id: device_health_has_critical_batteries
        state: >
          {{ states('sensor.device_health_critical_devices') | int > 0 }}
        device_class: problem

      - name: "Device Health Has Low Batteries"
        unique_id: device_health_has_low_batteries
        state: >
          {% set devices = state_attr('sensor.brief_data_devices', 'critical_batteries') %}
          {% set low_threshold = states('input_number.device_health_low_threshold') | int %}
          {% if devices %}
            {% set low_devices = devices | selectattr('level', '<=', low_threshold) | list %}
            {{ low_devices | length > 0 }}
          {% else %}
            false
          {% endif %}
        device_class: problem

  - sensor:
      - name: "Device Connectivity Z-Wave Problems"
        unique_id: device_connectivity_zwave_problems
        state: >
          {% set ns = namespace(problem_nodes=[]) %}
          {% for entity in states.sensor %}
            {% if entity.entity_id.endswith('_node_status') and not entity.entity_id.startswith('sensor.device_connectivity_') %}
              {% set status = entity.state | string | lower %}
              {% if status not in ['alive', 'asleep', 'awake'] %}
                {% set ns.problem_nodes = ns.problem_nodes + [entity.name or entity.entity_id] %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.problem_nodes | length }}
        unit_of_measurement: "nodes"
        attributes:
          problem_nodes: >
            {% set ns = namespace(problem_nodes=[]) %}
            {% for entity in states.sensor %}
              {% if entity.entity_id.endswith('_node_status') and not entity.entity_id.startswith('sensor.device_connectivity_') %}
                {% set status = entity.state | string | lower %}
                {% if status not in ['alive', 'asleep', 'awake'] %}
                  {% set ns.problem_nodes = ns.problem_nodes + [(entity.name or entity.entity_id) ~ ' (' ~ entity.state ~ ')'] %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.problem_nodes | join(', ') if ns.problem_nodes else 'None' }}

      - name: "Device Connectivity Stale Last Seen"
        unique_id: device_connectivity_stale_last_seen
        state: >
          {% set threshold_hours = states('input_number.device_connectivity_last_seen_threshold_hours') | int(24) %}
          {% set now_ts = as_timestamp(now()) %}
          {% set ns = namespace(stale_devices=[]) %}
          {% for entity in states.sensor %}
            {% if entity.entity_id.endswith('_last_seen') and not entity.entity_id.startswith('sensor.device_connectivity_') %}
              {% set last_seen = entity.state %}
              {% if last_seen not in ['unknown', 'unavailable', '', none] %}
                {% set age_hours = ((now_ts - as_timestamp(last_seen)) / 3600) | round(1) %}
                {% if age_hours > threshold_hours %}
                  {% set ns.stale_devices = ns.stale_devices + [(entity.name or entity.entity_id) ~ ' (' ~ age_hours ~ 'h)'] %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.stale_devices | length }}
        unit_of_measurement: "devices"
        attributes:
          threshold_hours: >
            {{ states('input_number.device_connectivity_last_seen_threshold_hours') | int(24) }}
          stale_devices: >
            {% set threshold_hours = states('input_number.device_connectivity_last_seen_threshold_hours') | int(24) %}
            {% set now_ts = as_timestamp(now()) %}
            {% set ns = namespace(stale_devices=[]) %}
            {% for entity in states.sensor %}
              {% if entity.entity_id.endswith('_last_seen') and not entity.entity_id.startswith('sensor.device_connectivity_') %}
                {% set last_seen = entity.state %}
                {% if last_seen not in ['unknown', 'unavailable', '', none] %}
                  {% set age_hours = ((now_ts - as_timestamp(last_seen)) / 3600) | round(1) %}
                  {% if age_hours > threshold_hours %}
                    {% set ns.stale_devices = ns.stale_devices + [(entity.name or entity.entity_id) ~ ' (' ~ age_hours ~ 'h)'] %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.stale_devices | join(', ') if ns.stale_devices else 'None' }}

      - name: "Device Connectivity Integration Problems"
        unique_id: device_connectivity_integration_problems
        state: >
          {% set ns = namespace(problem_updates=[]) %}
          {% for entity in states.update %}
            {% if entity.state in ['unavailable', 'unknown'] %}
              {% set ns.problem_updates = ns.problem_updates + [entity.name or entity.entity_id] %}
            {% endif %}
          {% endfor %}
          {{ ns.problem_updates | length }}
        unit_of_measurement: "entities"
        attributes:
          problem_updates: >
            {% set ns = namespace(problem_updates=[]) %}
            {% for entity in states.update %}
              {% if entity.state in ['unavailable', 'unknown'] %}
                {% set ns.problem_updates = ns.problem_updates + [(entity.name or entity.entity_id) ~ ' (' ~ entity.state ~ ')'] %}
              {% endif %}
            {% endfor %}
            {{ ns.problem_updates | join(', ') if ns.problem_updates else 'None' }}

      - name: "Device Connectivity Summary"
        unique_id: device_connectivity_summary
        state: >
          {{
            states('sensor.device_connectivity_zwave_problems') | int(0)
            + states('sensor.device_connectivity_stale_last_seen') | int(0)
            + states('sensor.device_connectivity_integration_problems') | int(0)
          }}
        unit_of_measurement: "issues"
        attributes:
          zwave_problem_nodes: >
            {{ state_attr('sensor.device_connectivity_zwave_problems', 'problem_nodes') }}
          stale_devices: >
            {{ state_attr('sensor.device_connectivity_stale_last_seen', 'stale_devices') }}
          integration_problems: >
            {{ state_attr('sensor.device_connectivity_integration_problems', 'problem_updates') }}

  - binary_sensor:
      - name: "Device Connectivity Has Issues"
        unique_id: device_connectivity_has_issues
        state: >
          {{ states('sensor.device_connectivity_summary') | int(0) > 0 }}
        device_class: problem

automation:
  - alias: "device_health_critical_battery_alert"
    id: "device_health_critical_battery_alert"
    description: "Alert when batteries reach critical levels (15% default)"
    trigger:
      - platform: state
        entity_id: binary_sensor.device_health_has_critical_batteries
        to: "on"
        for:
          minutes: 5 # Wait 5 minutes to avoid false alarms
    condition:
      - condition: state
        entity_id: input_boolean.device_health_monitoring_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.device_health_proactive_alerts
        state: "on"
      - condition: state
        entity_id: input_boolean.device_health_critical_alert_sent
        state: "off"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.device_health_critical_alert_sent

      - variables:
          critical_devices: "{{ state_attr('sensor.device_health_critical_devices', 'devices') }}"
          device_count: "{{ critical_devices | length }}"
          device_names: "{{ critical_devices | map(attribute='name') | list | join(', ') }}"
          lowest_level: "{{ critical_devices | map(attribute='level') | min }}"

      - service: notify.all_mobile_devices
        data:
          title: "Critical Battery Alert"
          message: >
            {{ device_count }} device{{ 's' if device_count > 1 else '' }} 
            ha{{ 's' if device_count == 1 else 've' }} critical battery levels.
            Lowest: {{ lowest_level }}%. Devices: {{ device_names }}
          data:
            tag: "device-health-critical"
            priority: "high"
            ttl: 0
            actions:
              - action: "device_health_view_details"
                title: "View Details"
              - action: "device_health_snooze"
                title: "Snooze 2hrs"
              - action: "device_health_dismiss"
                title: "Dismiss"

  - alias: "device_health_low_battery_alert"
    id: "device_health_low_battery_alert"
    description: "Urgent alert when batteries reach very low levels (5% default)"
    trigger:
      - platform: state
        entity_id: binary_sensor.device_health_has_low_batteries
        to: "on"
    condition:
      - condition: state
        entity_id: input_boolean.device_health_monitoring_enabled
        state: "on"
    action:
      - variables:
          devices: "{{ state_attr('sensor.brief_data_devices', 'critical_batteries') }}"
          low_threshold: "{{ states('input_number.device_health_low_threshold') | int }}"
          low_devices: >
            {% if devices %}
              {{ devices | selectattr('level', '<=', low_threshold) | list }}
            {% else %}
              []
            {% endif %}
          device_count: "{{ low_devices | length }}"
          device_names: "{{ low_devices | map(attribute='name') | list | join(', ') }}"

      - service: notify.all_mobile_devices
        data:
          title: "🚨 URGENT: Battery Nearly Dead"
          message: >
            {{ device_count }} device{{ 's' if device_count > 1 else '' }} 
            at critically low battery (≤{{ low_threshold }}%).
            Replace immediately: {{ device_names }}
          data:
            tag: "device-health-urgent"
            priority: "high"
            ttl: 0
            critical: true

  - alias: "device_health_alert_reset"
    id: "device_health_alert_reset"
    description: "Reset alert flags when batteries are replaced/charged"
    trigger:
      - platform: state
        entity_id: binary_sensor.device_health_has_critical_batteries
        to: "off"
        for:
          minutes: 10
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.device_health_critical_alert_sent

  - alias: "device_health_notification_actions"
    id: "device_health_notification_actions"
    description: "Handle device health notification actions"
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: device_health_view_details
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: device_health_snooze
      - platform: event
        event_type: mobile_app_notification_action
        event_data:
          action: device_health_dismiss
    action:
      - choose:
          # View details action (placeholder for dashboard link)
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.action == 'device_health_view_details' }}"
            sequence:
              - service: persistent_notification.create
                data:
                  title: "Device Health Details"
                  message: >
                    Critical batteries: {{ state_attr('sensor.device_health_critical_devices', 'devices') | length }}
                    Total batteries monitored: {{ states('sensor.device_health_battery_summary') }}

                    Details: {{ state_attr('sensor.device_health_critical_devices', 'devices') }}
                  notification_id: device_health_details

          # Snooze action
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.action == 'device_health_snooze' }}"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.device_health_critical_alert_sent
              - delay:
                  hours: 2
              # Re-check after snooze
              - if:
                  - condition: state
                    entity_id: binary_sensor.device_health_has_critical_batteries
                    state: "on"
                then:
                  - service: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.device_health_critical_alert_sent

          # Dismiss action
          - conditions:
              - condition: template
                value_template: "{{ trigger.event.data.action == 'device_health_dismiss' }}"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.device_health_critical_alert_sent

  - alias: "device_connectivity_issue_alert"
    id: "device_connectivity_issue_alert"
    description: "Alert when Z-Wave nodes, last_seen sensors, or integration update entities look unhealthy"
    trigger:
      - platform: state
        entity_id: binary_sensor.device_connectivity_has_issues
        to: "on"
        for:
          minutes: 15
    condition:
      - condition: state
        entity_id: input_boolean.device_connectivity_monitoring_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.device_connectivity_alerts_enabled
        state: "on"
      - condition: state
        entity_id: input_boolean.device_connectivity_alert_sent
        state: "off"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.device_connectivity_alert_sent
      - variables:
          total_issues: "{{ states('sensor.device_connectivity_summary') | int(0) }}"
          zwave_count: "{{ states('sensor.device_connectivity_zwave_problems') | int(0) }}"
          stale_count: "{{ states('sensor.device_connectivity_stale_last_seen') | int(0) }}"
          integration_count: "{{ states('sensor.device_connectivity_integration_problems') | int(0) }}"
          zwave_summary: "{{ state_attr('sensor.device_connectivity_zwave_problems', 'problem_nodes') }}"
          stale_summary: "{{ state_attr('sensor.device_connectivity_stale_last_seen', 'stale_devices') }}"
          integration_summary: "{{ state_attr('sensor.device_connectivity_integration_problems', 'problem_updates') }}"
      - service: notify.all_mobile_devices
        data:
          title: "Device Connectivity Alert"
          message: >
            Detected {{ total_issues }} connectivity issue{{ 's' if total_issues != 1 else '' }}.
            Z-Wave: {{ zwave_count }} ({{ zwave_summary }}).
            Last seen: {{ stale_count }} ({{ stale_summary }}).
            Integrations: {{ integration_count }} ({{ integration_summary }}).
          data:
            tag: "device-connectivity-alert"
            priority: "high"
            ttl: 0
      - service: persistent_notification.create
        data:
          title: "Device Connectivity Alert"
          notification_id: device_connectivity_alert
          message: >
            Z-Wave problem nodes: {{ zwave_summary }}

            Stale last_seen devices: {{ stale_summary }}

            Unavailable update entities: {{ integration_summary }}

            Threshold: {{ states('input_number.device_connectivity_last_seen_threshold_hours') | int(24) }} hours

  - alias: "device_connectivity_issue_alert_reset"
    id: "device_connectivity_issue_alert_reset"
    description: "Reset connectivity alert flag once all monitored entities recover"
    trigger:
      - platform: state
        entity_id: binary_sensor.device_connectivity_has_issues
        to: "off"
        for:
          minutes: 30
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.device_connectivity_alert_sent
      - service: persistent_notification.dismiss
        data:
          notification_id: device_connectivity_alert
