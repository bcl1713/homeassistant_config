# packages/notifications.yaml
#
# Home Assistant Notifications Package
# Features:
# - Bus detection notifications on school days
# - Other notification automations
#
# To use: Place this file in your /config/packages/ directory

automation:
  - id: "notification_bus_detection"
    alias: "notification_bus_detection"
    description: "Notify when school bus is detected"
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.driveway_camera_occupancy_bus
        from: "off"
        to: "on"
    condition:
      - condition: time
        after: 07:35:00
        before: 07:59:00
    action:
      - metadata: {}
        data:
          cache: true
          media_player_entity_id: media_player.all_speakers
          message: Bus detected.
        target:
          entity_id: tts.google_en_com
        action: tts.speak
    mode: single

  - id: "back_door_open_notification"
    alias: "Back Door Open Notification"
    description: "Notify Brian when the kitchen back door opens"
    trigger:
      - platform: state
        entity_id: binary_sensor.kitchen_back_door
        from: "off"
        to: "on"
    action:
      - service: notify.mobile_app_brian_phone
        data:
          title: "Back Door"
          message: "Back door opened."
          data:
            tag: "back-door-open"
    mode: single

  - id: "back_door_close_clear_notification"
    alias: "Back Door Close Clear Notification"
    description: "Clear Brian's back-door notification when the door closes"
    trigger:
      - platform: state
        entity_id: binary_sensor.kitchen_back_door
        from: "on"
        to: "off"
    action:
      - service: notify.mobile_app_brian_phone
        data:
          message: "clear_notification"
          data:
            tag: "back-door-open"
    mode: single
