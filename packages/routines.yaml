# packages/routines.yaml
#
# Common household routines packaged as scripts for direct calling
#
# Features:
# - Good Night routine for shutting down the house
# - Easily triggered via remote controls or voice commands

script:
  good_night:
    alias: "Good Night Routine"
    description:
      "Shuts down the house for the night, adjusts lighting, and secures the
      home"
    mode: restart
    sequence:
      # Set up variables we'll need
      - variables:
          is_mode_guest: "{{ is_state('input_boolean.mode_guest', 'on') }}"
          dishwasher_state:
            "{{ states('sensor.kitchen_dishwasher_operation_state') }}"
          is_dishwasher_available: >
            {% set invalid_states = ['unknown', 'unavailable', '', none] %}
            {{ dishwasher_state not in invalid_states }}
          is_dishwasher_running: >
            {{ is_dishwasher_available and
               dishwasher_state == "run" }}
          garage_door_state: "{{ states('cover.garage_door') }}"
          is_garage_open: "{{ garage_door_state == 'open' }}"
          has_garage_obstruction: >
            {{ is_state('binary_sensor.garage_door_obstruction', 'on') }}
          garage_notification_tag: >
            good-night-garage-door-{{ (now().timestamp() * 1000) | int }}-{{ range(0,
            999) | random }}
      # Always: Turn on bedside lamps to 50% with a nice transition
      - service: light.turn_on
        target:
          entity_id:
            - light.master_bedroom_lamp_brian
            - light.master_bedroom_lamp_hester
        data:
          brightness_pct: 50
          transition: 3

      # Always: Turn off outside lights
      - service: light.turn_off
        target:
          entity_id:
            - light.front_yard
            - light.back_yard

      # If Guest Mode is OFF: Turn off media players that are not in bedrooms
      - if:
          - condition: template
            value_template: "{{ not is_mode_guest }}"
        then:
          - service: media_player.turn_off
            target:
              entity_id:
                - media_player.kitchen_display
                - media_player.living_room_speaker
                - media_player.music_room_speaker
          - service: remote.turn_off
            target:
              entity_id:
                - remote.tv_living_room

      # If garage door is open: prompt before continuing with the rest of the
      # routine
      - if:
          - condition: template
            value_template: "{{ is_garage_open }}"
        then:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ not has_garage_obstruction }}"
                sequence:
                  - service: notify.all_mobile_devices
                    data:
                      title: "Good Night Routine"
                      message: >
                        Garage door is still open. Close it now before Good
                        Night continues?
                      data:
                        tag: "{{ garage_notification_tag }}"
                        when: "{{ now().timestamp() | int }}"
                        priority: "high"
                        ttl: 0
                        actions:
                          - action: "good_night_close_garage_door"
                            title: "Close Door"
                          - action: "good_night_continue"
                            title: "Continue"
            default:
              - service: notify.all_mobile_devices
                data:
                  title: "Good Night Routine"
                  message: >
                    Garage door is still open, but obstruction is detected so
                    remote close is unavailable. Close it manually, continue, or
                    Good Night will continue shortly.
                  data:
                    tag: "{{ garage_notification_tag }}"
                    when: "{{ now().timestamp() | int }}"
                    priority: "high"
                    ttl: 0
                    actions:
                      - action: "good_night_continue"
                        title: "Continue"

          - wait_for_trigger:
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: good_night_close_garage_door
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: good_night_continue
              - platform: state
                entity_id: cover.garage_door
                to: "closed"
            continue_on_timeout: true
            timeout: "00:03:00"

          - service: notify.all_mobile_devices
            data:
              message: "clear_notification"
              data:
                tag: "{{ garage_notification_tag }}"

          - if:
              - condition: template
                value_template: >
                  {{ wait.trigger is defined and
                     wait.trigger.platform == 'event' and
                     wait.trigger.event.data.action == 'good_night_close_garage_door' }}
            then:
              - if:
                  - condition: state
                    entity_id: binary_sensor.garage_door_obstruction
                    state: "off"
                then:
                  - service: cover.close_cover
                    target:
                      entity_id: cover.garage_door
                else:
                  - service: notify.all_mobile_devices
                    data:
                      title: "Good Night Routine"
                      message: >
                        Garage door is still open, but obstruction is now
                        detected so remote close was skipped.
                      data:
                        priority: "high"

      # Main logic branch for dishwasher state
      - choose:
          # If dishwasher is running
          - conditions:
              - condition: template
                value_template: "{{ is_dishwasher_running }}"
            sequence:
              # If Guest Mode is OFF: Turn off indoor lights
              - if:
                  - condition: template
                    value_template: "{{ not is_mode_guest }}"
                then:
                  - service: light.turn_off
                    target:
                      entity_id: light.downstairs_lights
              # Always: Arm the alarm system for night mode
              - service: alarm_control_panel.alarm_arm_night
                target:
                  entity_id: alarm_control_panel.home_alarm

          # If dishwasher state is unavailable
          - conditions:
              - condition: template
                value_template: "{{ not is_dishwasher_available }}"
            sequence:
              # Notify about sensor issue
              - service: notify.all_mobile_devices
                data:
                  message: >
                    Couldn't determine dishwasher state - sensor unavailable.
                    Continue with Good Night routine?
                  data:
                    actions:
                      - action: "continue"
                        title: "Continue"
                      - action: "cancel"
                        title: "Cancel"
              # Wait for user response
              - wait_for_trigger:
                  - platform: event
                    event_type: mobile_app_notification_action
                    event_data:
                      action: continue
                  - platform: event
                    event_type: mobile_app_notification_action
                    event_data:
                      action: cancel
                continue_on_timeout: true
                timeout: "00:02:00"

              # If canceled, stop here
              - if:
                  - condition: template
                    value_template: >
                      {{ wait.trigger is defined and 
                         wait.trigger.event.data.action == 'cancel' }}
                then:
                  - stop: "Good Night routine canceled by user"

              # If continued or timeout
              - if:
                  - condition: template
                    value_template: "{{ not is_mode_guest }}"
                then:
                  - service: light.turn_off
                    target:
                      entity_id: light.downstairs_lights
              # Always: Arm the alarm system
              - service: alarm_control_panel.alarm_arm_night
                target:
                  entity_id: alarm_control_panel.home_alarm

        # Default: Dishwasher is available but not running
        default:
          # Notify and wait for action or dishwasher to start
          - service: notify.all_mobile_devices
            data:
              message: >
                Dishwasher is not running. Kitchen lights will stay on until
                dishwasher starts or you continue.
              data:
                actions:
                  - action: "continue_anyway"
                    title: "Continue Anyway"

          # Log the waiting state
          - service: logbook.log
            data:
              name: "Good Night Routine"
              message: "Waiting for dishwasher to start or user action"

          # Wait for either user action or dishwasher to start
          - wait_for_trigger:
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: continue_anyway
              - platform: state
                entity_id: sensor.kitchen_dishwasher_operation_state
                to: "run"
            continue_on_timeout: true
            timeout: "00:05:00"

          # If dishwasher started, wait 2 minutes
          - if:
              - condition: template
                value_template: >
                  {{ wait.trigger is defined and 
                     wait.trigger.platform == 'state' }}
            then:
              - delay: "00:02:00"

          # If Guest Mode is OFF: Turn off indoor lights
          - if:
              - condition: template
                value_template: "{{ not is_mode_guest }}"
            then:
              - service: light.turn_off
                target:
                  entity_id: light.downstairs_lights

          # Always: Arm the alarm system for night mode
          - service: alarm_control_panel.alarm_arm_night
            target:
              entity_id: alarm_control_panel.home_alarm
