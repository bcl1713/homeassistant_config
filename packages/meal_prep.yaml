# packages/meal_prep.yaml
#
# Kitchen meal-preparation state model.
#
# This package is intentionally source-independent: it defines the persistent
# helper seams that #209 will populate from Mealie and the read-only template
# entities that #208/#210 will present or control. It contains no REST calls,
# automations, notifications, or device actions. The scripts below are manual
# operator seams only; they do not announce, refresh a source, or infer cooking.
#
# Persistence: every input helper intentionally omits `initial`. Home Assistant
# restores its last saved helper state after a restart; when no restored state
# exists, the session derives a fail-closed idle/unavailable result from the
# blank helpers. `input_boolean` helpers use Home Assistant's off default when
# no stored state is available.
#
# Source contract for a future normalizer:
# - Set input_text.meal_prep_source_status to ready only after all source fields
#   represent one coherent meal-plan snapshot.
# - Set input_datetime.meal_prep_source_updated_at to that snapshot time.
# - `ready` snapshots older than 180 minutes or dated in the future fail closed.
# - Valid non-ready status values are unavailable, error, and stale. Any other
#   value is treated as unavailable.

input_boolean:
  meal_prep_active:
    name: "Meal Prep Active"
    icon: mdi:chef-hat

  meal_prep_done:
    name: "Meal Prep Complete"
    icon: mdi:check-circle-outline

  # This is off unless an operator explicitly enables the supported Mealie
  # last-made write-back. Finish today always remains local-only.
  meal_prep_mealie_writeback_enabled:
    name: "Enable Mealie made-this write-back"
    icon: mdi:cloud-sync-outline

input_datetime:
  meal_prep_target_time:
    name: "Meal Prep Target Time"
    icon: mdi:calendar-clock
    has_date: true
    has_time: true

  meal_prep_source_updated_at:
    name: "Meal Prep Source Updated At"
    icon: mdi:database-clock-outline
    has_date: true
    has_time: true

input_text:
  # Persistent raw source seams. They are not directly presented to operators;
  # template sensors below normalize invalid data and source freshness.
  meal_prep_source_status:
    name: "Meal Prep Source Status Input"
    icon: mdi:database-alert-outline
    max: 32

  meal_prep_source_reason:
    name: "Meal Prep Source Reason Input"
    icon: mdi:database-search-outline
    max: 255

  meal_prep_meal_title:
    name: "Meal Prep Meal Title Input"
    icon: mdi:food-outline
    max: 255

  meal_prep_meal_type:
    name: "Meal Prep Meal Type Input"
    icon: mdi:format-list-bulleted-type
    max: 100

  meal_prep_recipe_reference:
    name: "Meal Prep Recipe Reference Input"
    icon: mdi:identifier
    max: 255

  meal_prep_recipe_url:
    name: "Meal Prep Recipe URL Input"
    icon: mdi:link-variant
    max: 255

  meal_prep_current_step:
    name: "Meal Prep Current Step Input"
    icon: mdi:format-list-numbered
    max: 255

  meal_prep_next_step:
    name: "Meal Prep Next Step Input"
    icon: mdi:skip-next-outline
    max: 255

  meal_prep_recipe_summary:
    name: "Meal Prep Recipe Summary Input"
    icon: mdi:timer-outline
    max: 160

  # The read-only adapter stores Mealie's verified ISO-8601 timing fields here.
  # Automatic orchestration consumes only the selected, validated lead-time
  # result and fails closed for unsupported values.
  meal_prep_recipe_prep_time:
    name: "Meal Prep Recipe Prep Time Input"
    icon: mdi:timer-sand
    max: 40

  meal_prep_recipe_cook_time:
    name: "Meal Prep Recipe Cook Time Input"
    icon: mdi:stove
    max: 40

  meal_prep_recipe_total_time:
    name: "Meal Prep Recipe Total Time Input"
    icon: mdi:timer-check-outline
    max: 40

  meal_prep_ingredient_context:
    name: "Meal Prep Ingredient Context Input"
    icon: mdi:format-list-bulleted
    max: 255

  meal_prep_snooze_until:
    name: "Meal Prep Snooze Until"
    icon: mdi:pause-circle-outline
    max: 40

  # Session-local, bounded audit state. The identity is date + recipe reference
  # so a restored done/active flag never leaks into another day's meal.
  meal_prep_session_key:
    name: "Meal Prep Session Key"
    icon: mdi:key-variant
    max: 255

  # Date+recipe identity already claimed by manual or automatic preparation.
  # Restoring it prevents a reload/refresh from casting the same meal again.
  meal_prep_automatic_handled_key:
    name: "Meal Prep Automatic Handled Key"
    icon: mdi:shield-check-outline
    max: 255

  # Local, bounded write-back audit seams. The pending identity/timestamp make a
  # retry use the exact same PATCH body after a timeout or transport failure.
  # No response body, URL, or credential is ever stored here.
  meal_prep_mealie_marked_key:
    name: "Meal Prep Mealie Marked Key"
    icon: mdi:cloud-check-outline
    max: 255

  meal_prep_mealie_write_pending_key:
    name: "Meal Prep Mealie Write Pending Key"
    icon: mdi:key-clock
    max: 255

  meal_prep_mealie_write_pending_timestamp:
    name: "Meal Prep Mealie Write Pending Timestamp"
    icon: mdi:clock-check-outline
    max: 40

  meal_prep_mealie_write_status:
    name: "Meal Prep Mealie Write Status"
    icon: mdi:cloud-alert-outline
    max: 32

  meal_prep_mealie_write_reason:
    name: "Meal Prep Mealie Write Reason"
    icon: mdi:information-outline
    max: 255

  meal_prep_last_skipped_step:
    name: "Meal Prep Last Skipped Step"
    icon: mdi:skip-next-circle-outline
    max: 255

  # Escaped-delimiter instructions after current/next. The adapter only stores
  # complete delimiter boundaries in this bounded helper.
  meal_prep_remaining_steps:
    name: "Meal Prep Remaining Steps"
    icon: mdi:format-list-numbered
    max: 255

script:
  meal_prep_start_preparation:
    alias: "Kitchen Prep: Start preparation"
    description: >
      Manually begin the fresh current meal once. A matching restored session
      retains its progress; a new date/recipe identity clears only local state.
    mode: single
    sequence:
      - variables:
          recipe_reference: "{{ states('sensor.meal_prep_recipe_reference') }}"
      # Do not construct or mutate a session without a delimiter-safe recipe ID.
      # The identity format is date|recipe-reference, so whitespace and `|` are
      # malformed source values even when Home Assistant does not mark them
      # unavailable.
      - condition: template
        value_template: >
          {{ recipe_reference == recipe_reference | regex_replace('\\s', '') and
             recipe_reference | lower not in ['', 'none', 'unavailable', 'unknown'] and
             '|' not in recipe_reference }}
      - variables:
          meal_prep_identity: "{{ now().date().isoformat() ~ '|' ~ recipe_reference }}"
      - condition: template
        value_template: >
          {{ states('sensor.meal_prep_source_status') == 'ready' and
             states('sensor.meal_prep_meal') not in ['none', 'unavailable', 'unknown'] and
             states('sensor.meal_prep_current_step') not in ['none', 'unavailable', 'unknown'] }}
      - choose:
          - conditions: "{{ states('input_text.meal_prep_session_key') != meal_prep_identity }}"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.meal_prep_done
              - action: input_text.set_value
                target:
                  entity_id:
                    - input_text.meal_prep_snooze_until
                    - input_text.meal_prep_last_skipped_step
                data:
                  value: ""
              - action: input_text.set_value
                target:
                  entity_id: input_text.meal_prep_session_key
                data:
                  value: "{{ meal_prep_identity }}"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.meal_prep_active
      - action: input_text.set_value
        target:
          entity_id: input_text.meal_prep_automatic_handled_key
        data:
          value: "{{ meal_prep_identity }}"

  meal_prep_complete_current_step:
    alias: "Kitchen Prep: Done / advance current step"
    description: >
      Advance the active session once by promoting the supplied next step. The
      script is single-run and never runs from startup/reload.
    mode: single
    sequence:
      - variables:
          recipe_reference: "{{ states('sensor.meal_prep_recipe_reference') }}"
      - condition: template
        value_template: >
          {{ recipe_reference == recipe_reference | regex_replace('\\s', '') and
             recipe_reference | lower not in ['', 'none', 'unavailable', 'unknown'] and
             '|' not in recipe_reference }}
      - variables:
          meal_prep_identity: "{{ now().date().isoformat() ~ '|' ~ recipe_reference }}"
          current_step: "{{ states('sensor.meal_prep_current_step') }}"
          next_step: "{{ states('sensor.meal_prep_next_step') }}"
          queued_step: "{{ states('input_text.meal_prep_remaining_steps').split('\\u001f')[0] if states('input_text.meal_prep_remaining_steps') not in ['', 'unknown', 'unavailable'] else '' }}"
          following_steps: "{{ states('input_text.meal_prep_remaining_steps').split('\\u001f')[1:] | join('\\u001f') if states('input_text.meal_prep_remaining_steps') not in ['', 'unknown', 'unavailable'] else '' }}"
      - condition: template
        value_template: >
          {{ states('sensor.meal_prep_source_status') == 'ready' and
             is_state('input_boolean.meal_prep_active', 'on') and
             states('input_text.meal_prep_session_key') == meal_prep_identity and
             current_step not in ['none', 'unavailable', 'unknown'] and
             next_step not in ['none', 'unavailable', 'unknown'] }}
      - action: input_text.set_value
        target:
          entity_id: input_text.meal_prep_current_step
        data:
          value: "{{ next_step }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.meal_prep_next_step
        data:
          value: "{{ queued_step }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.meal_prep_remaining_steps
        data:
          value: "{{ following_steps }}"

  meal_prep_skip_current_step:
    alias: "Kitchen Prep: Skip current step"
    description: >
      Record a deliberate skip, then advance without marking the meal complete.
      A bounded source queue can supply later steps; no step is fabricated when
      the current/next/queue source seams have no valid value.
    mode: single
    sequence:
      - variables:
          recipe_reference: "{{ states('sensor.meal_prep_recipe_reference') }}"
      - condition: template
        value_template: >
          {{ recipe_reference == recipe_reference | regex_replace('\\s', '') and
             recipe_reference | lower not in ['', 'none', 'unavailable', 'unknown'] and
             '|' not in recipe_reference }}
      - variables:
          meal_prep_identity: "{{ now().date().isoformat() ~ '|' ~ recipe_reference }}"
          current_step: "{{ states('sensor.meal_prep_current_step') }}"
          next_step: "{{ states('sensor.meal_prep_next_step') }}"
          queued_step: "{{ states('input_text.meal_prep_remaining_steps').split('\\u001f')[0] if states('input_text.meal_prep_remaining_steps') not in ['', 'unknown', 'unavailable'] else '' }}"
          following_steps: "{{ states('input_text.meal_prep_remaining_steps').split('\\u001f')[1:] | join('\\u001f') if states('input_text.meal_prep_remaining_steps') not in ['', 'unknown', 'unavailable'] else '' }}"
      - condition: template
        value_template: >
          {{ states('sensor.meal_prep_source_status') == 'ready' and
             is_state('input_boolean.meal_prep_active', 'on') and
             states('input_text.meal_prep_session_key') == meal_prep_identity and
             current_step not in ['none', 'unavailable', 'unknown'] }}
      - action: input_text.set_value
        target:
          entity_id: input_text.meal_prep_last_skipped_step
        data:
          value: "{{ current_step }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.meal_prep_current_step
        data:
          value: "{{ '' if next_step in ['none', 'unavailable', 'unknown'] else next_step }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.meal_prep_next_step
        data:
          value: "{{ queued_step }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.meal_prep_remaining_steps
        data:
          value: "{{ following_steps }}"

  meal_prep_snooze_preparation:
    alias: "Kitchen Prep: Snooze preparation"
    description: "Pause the active session for a bounded 5-to-60-minute interval."
    mode: single
    fields:
      snooze_minutes:
        name: "Snooze minutes"
        default: 30
        selector:
          number:
            min: 5
            max: 60
            step: 5
            unit_of_measurement: min
    sequence:
      - variables:
          recipe_reference: "{{ states('sensor.meal_prep_recipe_reference') }}"
      - condition: template
        value_template: >
          {{ recipe_reference == recipe_reference | regex_replace('\\s', '') and
             recipe_reference | lower not in ['', 'none', 'unavailable', 'unknown'] and
             '|' not in recipe_reference }}
      - variables:
          meal_prep_identity: "{{ now().date().isoformat() ~ '|' ~ recipe_reference }}"
          bounded_snooze_minutes: "{{ [5, [snooze_minutes | default(30, true) | int(30), 60] | min] | max }}"
      - condition: template
        value_template: >
          {{ states('sensor.meal_prep_source_status') == 'ready' and
             is_state('input_boolean.meal_prep_active', 'on') and
             states('input_text.meal_prep_session_key') == meal_prep_identity }}
      - action: input_text.set_value
        target:
          entity_id: input_text.meal_prep_snooze_until
        data:
          value: "{{ (now() + timedelta(minutes=bounded_snooze_minutes | int)).isoformat() }}"

  meal_prep_finish_for_today:
    alias: "Kitchen Prep: Finish for today"
    description: "Suppress the matching current meal/date without changing source data."
    mode: single
    sequence:
      - variables:
          recipe_reference: "{{ states('sensor.meal_prep_recipe_reference') }}"
      - condition: template
        value_template: >
          {{ recipe_reference == recipe_reference | regex_replace('\\s', '') and
             recipe_reference | lower not in ['', 'none', 'unavailable', 'unknown'] and
             '|' not in recipe_reference }}
      - variables:
          meal_prep_identity: "{{ now().date().isoformat() ~ '|' ~ recipe_reference }}"
      - condition: template
        value_template: >
          {{ states('sensor.meal_prep_source_status') == 'ready' and
             states('input_text.meal_prep_session_key') == meal_prep_identity }}
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.meal_prep_active
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.meal_prep_done
      - action: input_text.set_value
        target:
          entity_id: input_text.meal_prep_snooze_until
        data:
          value: ""
      - action: input_text.set_value
        target:
          entity_id: input_text.meal_prep_automatic_handled_key
        data:
          value: "{{ meal_prep_identity }}"

  meal_prep_mark_made_in_mealie:
    alias: "Kitchen Prep: Mark made in Mealie"
    description: >
      Explicitly set the linked recipe's Mealie last-made timestamp. This is
      disabled by default, requires dashboard confirmation, and never runs from
      Start or Finish today. A stable meal identity and timestamp make retries
      safe after an unknown transport outcome.
    mode: single
    fields:
      confirm:
        name: "Confirm Mealie write-back"
        description: "Must be explicitly true; the dashboard also shows a confirmation dialog."
        required: true
        selector:
          boolean:
    sequence:
      - variables:
          recipe_reference: "{{ states('sensor.meal_prep_recipe_reference') }}"
      - variables:
          meal_prep_identity: "{{ now().date().isoformat() ~ '|' ~ recipe_reference }}"
      - choose:
          - conditions: "{{ not is_state('input_boolean.meal_prep_mealie_writeback_enabled', 'on') }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.meal_prep_mealie_write_status
                data:
                  value: disabled
              - action: input_text.set_value
                target:
                  entity_id: input_text.meal_prep_mealie_write_reason
                data:
                  value: "Mealie write-back is disabled"
          - conditions: >
              {{ not (recipe_reference | regex_match('^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$')) or
                 states('sensor.meal_prep_source_status') != 'ready' or
                 states('sensor.meal_prep_meal') in ['none', 'unavailable', 'unknown'] }}
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.meal_prep_mealie_write_status
                data:
                  value: invalid
              - action: input_text.set_value
                target:
                  entity_id: input_text.meal_prep_mealie_write_reason
                data:
                  value: "Mealie write-back requires a fresh linked recipe"
          - conditions: "{{ confirm | default(false) | bool == false }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.meal_prep_mealie_write_status
                data:
                  value: unconfirmed
              - action: input_text.set_value
                target:
                  entity_id: input_text.meal_prep_mealie_write_reason
                data:
                  value: "Mealie write-back was not confirmed"
          - conditions: "{{ states('input_text.meal_prep_mealie_marked_key') == meal_prep_identity }}"
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.meal_prep_mealie_write_status
                data:
                  value: duplicate
              - action: input_text.set_value
                target:
                  entity_id: input_text.meal_prep_mealie_write_reason
                data:
                  value: "This recipe is already marked made for today"
        default:
          - choose:
              - conditions: >
                  {{ states('input_text.meal_prep_mealie_write_pending_key') != meal_prep_identity or
                     as_timestamp(states('input_text.meal_prep_mealie_write_pending_timestamp'), default=none) is none }}
                sequence:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.meal_prep_mealie_write_pending_key
                    data:
                      value: "{{ meal_prep_identity }}"
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.meal_prep_mealie_write_pending_timestamp
                    data:
                      value: "{{ now().isoformat() }}"
          - variables:
              mealie_made_timestamp: >
                {% set pending_timestamp = states('input_text.meal_prep_mealie_write_pending_timestamp') %}
                {{ pending_timestamp if states('input_text.meal_prep_mealie_write_pending_key') == meal_prep_identity and as_timestamp(pending_timestamp, default=none) is not none else now().isoformat() }}
          - action: rest_command.mealie_mark_made
            data:
              mealie_recipe_id: "{{ recipe_reference }}"
              mealie_made_timestamp: "{{ mealie_made_timestamp }}"
            response_variable: mealie_write_response
            continue_on_error: true
          - variables:
              mealie_write_status: "{{ mealie_write_response.status | default(0, true) | int(0) }}"
              mealie_write_content: "{{ mealie_write_response.content | default({}, true) }}"
          - choose:
              - conditions: >
                  {{ mealie_write_status == 200 and mealie_write_content is mapping and
                     (mealie_write_content.id | default('', true) | string | lower | trim) == (recipe_reference | lower) }}
                sequence:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.meal_prep_mealie_marked_key
                    data:
                      value: "{{ meal_prep_identity }}"
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.meal_prep_mealie_write_status
                    data:
                      value: success
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.meal_prep_mealie_write_reason
                    data:
                      value: "Marked made in Mealie"
              - conditions: "{{ mealie_write_status in [401, 403] }}"
                sequence:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.meal_prep_mealie_write_status
                    data:
                      value: unauthorized
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.meal_prep_mealie_write_reason
                    data:
                      value: "Mealie write-back was not authorized"
              - conditions: "{{ mealie_write_status == 409 }}"
                sequence:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.meal_prep_mealie_write_status
                    data:
                      value: duplicate
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.meal_prep_mealie_write_reason
                    data:
                      value: "Mealie rejected the write as a duplicate"
              - conditions: "{{ mealie_write_status in [404, 405, 501] }}"
                sequence:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.meal_prep_mealie_write_status
                    data:
                      value: unsupported
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.meal_prep_mealie_write_reason
                    data:
                      value: "Mealie write-back endpoint is unavailable"
              - conditions: "{{ mealie_write_status in [408, 504] }}"
                sequence:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.meal_prep_mealie_write_status
                    data:
                      value: timeout
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.meal_prep_mealie_write_reason
                    data:
                      value: "Mealie write-back timed out; retry is safe"
              - conditions: "{{ mealie_write_status == 0 }}"
                sequence:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.meal_prep_mealie_write_status
                    data:
                      value: unavailable
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.meal_prep_mealie_write_reason
                    data:
                      value: "Mealie write-back was unavailable; retry is safe"
            default:
              - action: input_text.set_value
                target:
                  entity_id: input_text.meal_prep_mealie_write_status
                data:
                  value: failed
              - action: input_text.set_value
                target:
                  entity_id: input_text.meal_prep_mealie_write_reason
                data:
                  value: "Mealie write-back response was malformed or unsuccessful"

  meal_prep_show_dashboard:
    alias: "Kitchen Prep: Show dashboard"
    description: >
      Wake the kitchen display when needed, allow its Cast receiver to settle,
      then show the YAML-managed Kitchen Prep view.
    mode: single
    sequence:
      - choose:
          - conditions:
              - condition: state
                entity_id: media_player.kitchen_display
                state: "off"
            sequence:
              - action: media_player.turn_on
                target:
                  entity_id: media_player.kitchen_display
              - wait_template: "{{ not is_state('media_player.kitchen_display', 'off') }}"
                timeout: "00:00:15"
                continue_on_timeout: false
              - delay: "00:00:02"
      - action: cast.show_lovelace_view
        target:
          entity_id: media_player.kitchen_display
        data:
          dashboard_path: kitchen-prep
          view_path: kitchen-prep

  meal_prep_clear_session:
    alias: "Kitchen Prep: Hide / clear preparation session"
    description: >
      Clear only local preparation state. It intentionally leaves the fresh
      Mealie source snapshot intact for the dashboard's next planned session.
    mode: single
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.meal_prep_active
            - input_boolean.meal_prep_done
      - action: input_text.set_value
        target:
          entity_id:
            - input_text.meal_prep_snooze_until
            - input_text.meal_prep_session_key
            - input_text.meal_prep_last_skipped_step
        data:
          value: ""

template:
  - sensor:
      # The 180-minute freshness bound is intentionally package-owned until a
      # later operator-control card adds a reviewed tuning helper.
      - name: "Meal Prep Source Status"
        unique_id: meal_prep_source_status
        icon: mdi:database-check-outline
        state: >
          {% set raw_status = states('input_text.meal_prep_source_status') | lower | trim %}
          {% set updated_at = as_timestamp(states('input_datetime.meal_prep_source_updated_at'), default=none) %}
          {% if raw_status in ['unavailable', 'error', 'stale'] %}
            {{ raw_status }}
          {% elif raw_status != 'ready' %}
            unavailable
          {% elif updated_at is none or updated_at <= 0 %}
            unavailable
          {% elif updated_at > now().timestamp() %}
            unavailable
          {% elif now().timestamp() - updated_at > 10800 %}
            stale
          {% else %}
            ready
          {% endif %}
        attributes:
          reason: >
            {% set raw_status = states('input_text.meal_prep_source_status') | lower | trim %}
            {% set raw_reason = states('input_text.meal_prep_source_reason') | trim %}
            {% set source_reason = '' if raw_reason | lower in ['unknown', 'unavailable', 'none'] else raw_reason %}
            {% set updated_at = as_timestamp(states('input_datetime.meal_prep_source_updated_at'), default=none) %}
            {% if raw_status in ['unavailable', 'error', 'stale'] %}
              {{ source_reason if source_reason != '' else 'source reported ' ~ raw_status }}
            {% elif raw_status != 'ready' %}
              invalid source status
            {% elif updated_at is none or updated_at <= 0 %}
              missing source update time
            {% elif updated_at > now().timestamp() %}
              source update is in the future
            {% elif now().timestamp() - updated_at > 10800 %}
              source update is older than 180 minutes
            {% elif source_reason != '' %}
              {{ source_reason }}
            {% else %}
              source snapshot is fresh
            {% endif %}
          source_updated_at: "{{ states('input_datetime.meal_prep_source_updated_at') }}"
          freshness_limit_minutes: 180

