homeassistant:
  packages: !include_dir_named packages

# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

lovelace:
  dashboards:
    window-ventilation:
      mode: yaml
      title: "Ventilation Advisor"
      icon: mdi:window-open-variant
      show_in_sidebar: false
      filename: dashboards/window_ventilation.yaml
    climate-control:
      mode: yaml
      title: "Climate Control"
      icon: mdi:thermostat-auto
      show_in_sidebar: true
      filename: dashboards/climate_control.yaml

automation: !include_dir_merge_list automation
input_boolean: !include_dir_merge_named input_boolean
scene: !include scenes.yaml

http:
  use_x_forwarded_for: true
  trusted_proxies:
    # Interim issue #93 fix: trust only the current server-VLAN CIDR until
    # Cloudflare tunnel traffic is bound to a single stable proxy IP.
    - 10.10.50.0/24

google_assistant:
  project_id: homeassistant-32654
  service_account: !include SERVICE_ACCOUNT.json
  report_state: true

# Custom Configs Below
recorder: !include recorder.yaml

logbook: !include logbook.yaml

notify:
  - platform: group
    name: all_mobile_devices
    services:
      - service: mobile_app_brian_phone
      - service: mobile_app_hester_phone
