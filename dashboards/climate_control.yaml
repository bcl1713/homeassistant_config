# dashboards/climate_control.yaml
#
# Mobile-first operator view for climate control.
#
# This dashboard is YAML-managed from configuration.yaml. Trend cards use the
# already-installed mini-graph-card custom card for compact operator history.

title: "Climate Control"
views:
  - title: "Climate"
    path: "climate-control"
    icon: mdi:thermostat-auto
    badges: []
    cards:
      - type: conditional
        conditions:
          - entity: input_boolean.climate_automation_enabled
            state: "off"
        card:
          type: markdown
          title: "Climate automation paused"
          content: >-
            ## Climate automation is off

            Schedule, away, pre-arrival, and extreme-heat automations will not
            manage the thermostat until automation is re-enabled.

      - type: conditional
        conditions:
          - entity: binary_sensor.climate_extreme_heat_day
            state: "on"
          - entity: input_boolean.climate_extreme_heat_overlay_enabled
            state: "off"
        card:
          type: markdown
          title: "Extreme heat overlay disabled"
          content: >-
            ## Extreme heat expected, overlay disabled

            Forecast high: {{ state_attr('binary_sensor.climate_extreme_heat_day', 'forecast_high_f') | default('unknown', true) }}°F<br>
            Threshold: {{ states('input_number.climate_extreme_heat_threshold') }}°F

      - type: conditional
        conditions:
          - entity: input_boolean.climate_extreme_heat_precool_active
            state: "on"
        card:
          type: markdown
          title: "Pre-cool active"
          content: >-
            ## Extreme-heat pre-cool is active

            Current cooling bias: {{ states('input_number.climate_extreme_heat_precool_offset') }}°F below the daytime cooling target.

      - type: conditional
        conditions:
          - entity: binary_sensor.climate_extreme_heat_day
            state: "on"
          - entity: input_boolean.climate_extreme_heat_overlay_enabled
            state: "on"
        card:
          type: markdown
          title: "Extreme heat day"
          content: >-
            ## Extreme heat expected

            Forecast high: {{ state_attr('binary_sensor.climate_extreme_heat_day', 'forecast_high_f') | default('unknown', true) }}°F<br>
            Overlay is armed and may pre-cool during eligible occupied,
            guest, or pre-arrival windows.

      - type: conditional
        conditions:
          - entity: binary_sensor.climate_pre_arrival_expected
            state: "on"
        card:
          type: markdown
          title: "Pre-arrival expected"
          content: >-
            ## Climate pre-arrival is eligible

            Expected arrivals: {{ state_attr('binary_sensor.climate_pre_arrival_expected', 'expected_people') | default('unknown', true) }}<br>
            Rule: {{ state_attr('binary_sensor.climate_pre_arrival_expected', 'reason') | default('active', true) }}

      - type: thermostat
        entity: climate.dining_room_thermostat
        name: "Dining Room Thermostat"

      - type: custom:mini-graph-card
        name: "Temperature trends"
        hours_to_show: 24
        points_per_hour: 4
        hour24: true
        animate: false
        show:
          legend: true
          labels: true
          labels_secondary: false
          points: false
          extrema: true
        lower_bound_secondary: 0
        upper_bound_secondary: 1
        entities:
          - entity: sensor.dining_room_thermostat_temperature
            name: "Dining room"
            color: "#f9a825"
          - entity: sensor.master_bedroom_sensor_temperature
            name: "Bedroom"
            color: "#7e57c2"
          - entity: sensor.average_indoor_temperature
            name: "Indoor avg"
            color: "#26a69a"
            line_width: 4
          - entity: sensor.weather_outdoor_temperature
            name: "Outdoor"
            color: "#42a5f5"
          - entity: binary_sensor.climate_heating_active
            name: "Heating"
            color: "#ef5350"
            y_axis: secondary
            aggregate_func: max
            show_state: false
            smoothing: false
          - entity: binary_sensor.climate_cooling_active
            name: "Cooling"
            color: "#29b6f6"
            y_axis: secondary
            aggregate_func: max
            show_state: false
            smoothing: false

      - type: custom:mini-graph-card
        name: "Air quality trends"
        hours_to_show: 24
        points_per_hour: 4
        hour24: true
        animate: false
        show:
          legend: true
          labels: true
          labels_secondary: true
          points: false
          extrema: true
        entities:
          - entity: sensor.thermostat_vocs
            name: "VOC"
            color: "#ab47bc"
          - entity: sensor.thermostat_carbon_dioxide
            name: "CO2"
            color: "#66bb6a"
            y_axis: secondary
          - entity: binary_sensor.climate_heating_active
            name: "Heating"
            color: "#ef5350"
            aggregate_func: max
            show_state: false
            smoothing: false
          - entity: binary_sensor.climate_cooling_active
            name: "Cooling"
            color: "#29b6f6"
            aggregate_func: max
            show_state: false
            smoothing: false

      - type: grid
        title: "Schedule tuning"
        columns: 1
        square: false
        cards:
          - type: entities
            title: "Cooling setpoints"
            show_header_toggle: false
            entities:
              - entity: input_number.climate_cool_morning
                name: "Morning"
              - entity: input_number.climate_cool_day
                name: "Daytime"
              - entity: input_number.climate_cool_bedtime
                name: "Bedtime"
              - entity: input_number.climate_cool_sleep
                name: "Sleep"
              - entity: input_number.climate_cool_away
                name: "Away"
          - type: entities
            title: "Heating setpoints"
            show_header_toggle: false
            entities:
              - entity: input_number.climate_heat_morning
                name: "Morning"
              - entity: input_number.climate_heat_day
                name: "Daytime"
              - entity: input_number.climate_heat_bedtime
                name: "Bedtime"
              - entity: input_number.climate_heat_sleep
                name: "Sleep"
              - entity: input_number.climate_heat_away
                name: "Away"

      - type: entities
        title: "Extreme heat tuning"
        show_header_toggle: false
        entities:
          - entity: binary_sensor.climate_extreme_heat_day
            name: "Extreme heat day"
          - type: attribute
            entity: binary_sensor.climate_extreme_heat_day
            attribute: forecast_high_f
            name: "Forecast high"
            suffix: "°F"
          - entity: input_number.climate_extreme_heat_threshold
            name: "Extreme heat threshold"
          - entity: input_number.climate_extreme_heat_precool_offset
            name: "Pre-cool offset"
          - entity: input_boolean.climate_extreme_heat_precool_active
            name: "Pre-cool active"
          - entity: binary_sensor.climate_pre_arrival_expected
            name: "Pre-arrival expected"

      - type: entities
        title: "Diagnostics / why"
        show_header_toggle: false
        entities:
          - type: attribute
            entity: climate.dining_room_thermostat
            attribute: hvac_action
            name: "Current HVAC action"
          - type: attribute
            entity: climate.dining_room_thermostat
            attribute: target_temp_low
            name: "Active heat target"
            suffix: "°F"
          - type: attribute
            entity: climate.dining_room_thermostat
            attribute: target_temp_high
            name: "Active cool target"
            suffix: "°F"
          - entity: sensor.dining_room_thermostat_temperature
            name: "Indoor temperature"
          - entity: sensor.thermostat_humidity
            name: "Indoor humidity"
          - entity: zone.home
            name: "People home"
          - entity: input_boolean.mode_guest
            name: "Guest mode"
          - type: attribute
            entity: binary_sensor.climate_extreme_heat_day
            attribute: decision_scope
            name: "Hot-day decision scope"
          - type: attribute
            entity: binary_sensor.climate_pre_arrival_expected
            attribute: expected_people
            name: "Expected arrivals"
          - type: attribute
            entity: binary_sensor.climate_pre_arrival_expected
            attribute: reason
            name: "Pre-arrival rule"
