# dashboards/climate_control.yaml
#
# Mobile-first operator view for climate control.
#
# This dashboard is YAML-managed from packages/shared_infrastructure.yaml. Trend
# cards use the already-installed mini-graph-card custom card for compact
# operator history.

title: "Climate Control"
views:
  - title: "Climate"
    path: "climate-control"
    icon: mdi:thermostat-auto
    badges: []
    cards:
      - type: conditional
        conditions:
          - entity: input_boolean.climate_automation_enabled
            state: "off"
        card:
          type: markdown
          title: "Climate automation paused"
          content: >-
            ## Climate automation is off

            Schedule, away, pre-arrival, and extreme-heat automations will not
            manage the thermostat until automation is re-enabled.

      - type: conditional
        conditions:
          - entity: binary_sensor.climate_extreme_heat_day
            state: "on"
          - entity: input_boolean.climate_extreme_heat_overlay_enabled
            state: "off"
        card:
          type: markdown
          title: "Extreme heat overlay disabled"
          content: >-
            ## Extreme heat expected, overlay disabled

            Forecast high: {{ states('sensor.temperature_forecast_high_today') }}°F<br>
            Threshold: {{ states('input_number.climate_extreme_heat_threshold') }}°F

      - type: conditional
        conditions:
          - entity: input_boolean.climate_extreme_heat_precool_active
            state: "on"
        card:
          type: markdown
          title: "Pre-cool active"
          content: >-
            ## Extreme-heat pre-cool is active

            Current cooling bias: {{ states('input_number.climate_extreme_heat_precool_offset') }}°F below the daytime cooling target.

      - type: conditional
        conditions:
          - entity: binary_sensor.climate_extreme_heat_day
            state: "on"
          - entity: input_boolean.climate_extreme_heat_overlay_enabled
            state: "on"
        card:
          type: markdown
          title: "Extreme heat day"
          content: >-
            ## Extreme heat expected

            Forecast high: {{ states('sensor.temperature_forecast_high_today') }}°F<br>
            Overlay is armed and may pre-cool during eligible occupied,
            guest, or pre-arrival windows.

      - type: conditional
        conditions:
          - entity: binary_sensor.climate_pre_arrival_expected
            state: "on"
        card:
          type: markdown
          title: "Pre-arrival expected"
          content: >-
            ## Climate pre-arrival is eligible

            An eligible resident appears to be nearing home. Climate recovery may
            restore the normal daytime targets if the house is empty and guest
            mode is off.

      - type: grid
        title: "Primary operator view"
        columns: 1
        square: false
        cards:
          - type: thermostat
            entity: climate.dining_room_thermostat
            name: "Dining Room Thermostat"

          - type: custom:mini-graph-card
            <<: &climate_activity_graph
              hours_to_show: 24
              points_per_hour: 4
              hour24: true
              animate: false
              lower_bound_secondary: 0
              upper_bound_secondary: 1
              state_map:
                - value: "off"
                  label: "Inactive"
                - value: "on"
                  label: "Active"
              show: &climate_activity_show
                legend: true
                labels: true
                labels_secondary: false
                points: false
                extrema: true
            name: "Temperature trends"
            entities:
              - entity: sensor.average_indoor_temperature
                name: "Indoor avg"
                color: "#26a69a"
                line_width: 4
                show_fill: false
              - &heating_overlay
                entity: binary_sensor.climate_heating_active
                name: "Heating"
                color: "rgba(239, 83, 80, 0.35)"
                y_axis: secondary
                aggregate_func: max
                show_line: false
                show_fill: true
                show_points: false
                show_state: false
                smoothing: false
              - &cooling_overlay
                entity: binary_sensor.climate_cooling_active
                name: "Cooling"
                color: "rgba(41, 182, 246, 0.35)"
                y_axis: secondary
                aggregate_func: max
                show_line: false
                show_fill: true
                show_points: false
                show_state: false
                smoothing: false

          - type: custom:mini-graph-card
            <<: &climate_detail_graph
              hours_to_show: 24
              points_per_hour: 4
              hour24: true
              animate: false
              show: &climate_detail_show
                legend: true
                labels: true
                points: false
                extrema: true
            name: "Room temperatures"
            entities:
              - entity: sensor.average_indoor_temperature
                name: "Indoor average"
                color: "#26a69a"
                line_width: 4
                show_fill: false
              - entity: sensor.dining_room_thermostat_temperature
                name: "Dining room"
                color: "#42a5f5"
                line_width: 2
                show_fill: false
              - entity: sensor.master_bedroom_sensor_temperature
                name: "Master bedroom"
                color: "#ab47bc"
                line_width: 2
                show_fill: false
              - entity: sensor.weather_outdoor_temperature
                name: "Outdoor"
                color: "#78909c"
                line_width: 2
                show_fill: false

          - type: custom:mini-graph-card
            <<: *climate_activity_graph
            name: "Air quality trends"
            entities:
              - entity: sensor.thermostat_air_quality_index
                name: "AQI"
                color: "#ff7043"
                line_width: 4
                show_fill: false
              - *heating_overlay
              - *cooling_overlay

          - type: custom:mini-graph-card
            <<: *climate_detail_graph
            name: "Air quality details"
            entities:
              - entity: sensor.thermostat_air_quality_index
                name: "AQI"
                color: "#ff7043"
                line_width: 4
                show_fill: false
              - entity: sensor.thermostat_carbon_dioxide
                name: "CO2"
                color: "#7e57c2"
                line_width: 2
                show_fill: false
              - entity: sensor.thermostat_vocs
                name: "VOC"
                color: "#66bb6a"
                line_width: 2
                show_fill: false

      - type: grid
        title: "Admin tuning"
        columns: 1
        square: false
        cards:
          - type: entities
            title: "Cooling setpoints"
            show_header_toggle: false
            entities:
              - entity: input_number.climate_cool_morning
                name: "Morning"
              - entity: input_number.climate_cool_day
                name: "Daytime"
              - entity: input_number.climate_cool_bedtime
                name: "Bedtime"
              - entity: input_number.climate_cool_sleep
                name: "Sleep"
              - entity: input_number.climate_cool_away
                name: "Away"

          - type: entities
            title: "Heating setpoints"
            show_header_toggle: false
            entities:
              - entity: input_number.climate_heat_morning
                name: "Morning"
              - entity: input_number.climate_heat_day
                name: "Daytime"
              - entity: input_number.climate_heat_bedtime
                name: "Bedtime"
              - entity: input_number.climate_heat_sleep
                name: "Sleep"
              - entity: input_number.climate_heat_away
                name: "Away"

          - type: entities
            title: "Extreme heat overlay"
            show_header_toggle: false
            entities:
              - entity: binary_sensor.climate_extreme_heat_day
                name: "Extreme heat day"
              - entity: sensor.temperature_forecast_high_today
                name: "Forecast high"
              - entity: input_number.climate_extreme_heat_threshold
                name: "Extreme heat threshold"
              - entity: input_number.climate_extreme_heat_precool_offset
                name: "Pre-cool offset"
              - entity: input_boolean.climate_extreme_heat_overlay_enabled
                name: "Overlay enabled"
              - entity: input_boolean.climate_extreme_heat_precool_active
                name: "Pre-cool active"

      - type: entities
        title: "Operational diagnostics"
        show_header_toggle: false
        entities:
          - type: attribute
            entity: climate.dining_room_thermostat
            attribute: hvac_action
            name: "Current HVAC action"
          - type: attribute
            entity: climate.dining_room_thermostat
            attribute: target_temp_low
            name: "Active heat target"
            suffix: "°F"
          - type: attribute
            entity: climate.dining_room_thermostat
            attribute: target_temp_high
            name: "Active cool target"
            suffix: "°F"
          - entity: sensor.dining_room_thermostat_temperature
            name: "Indoor temperature"
          - entity: sensor.thermostat_humidity
            name: "Indoor humidity"
          - entity: zone.home
            name: "People home"
          - entity: input_boolean.mode_guest
            name: "Guest mode"
          - entity: binary_sensor.climate_pre_arrival_expected
            name: "Pre-arrival eligible"
