# dashboards/window_ventilation.yaml
#
# Focused operator view for the window ventilation advisor.
#
# This dashboard is wired from configuration.yaml as a YAML-managed Lovelace
# dashboard with show_in_sidebar: false. That keeps it available by direct URL
# without promoting another item into the default sidebar.

title: "Ventilation Advisor"
views:
  - title: "Window Ventilation"
    path: "ventilation-advisor"
    icon: mdi:window-open-variant
    badges: []
    cards:
      - type: markdown
        title: "Current advice"
        content: >-
          {% set rec = states('sensor.window_ventilation_recommendation') %}
          {% set mode = state_attr('sensor.window_ventilation_recommendation', 'mode') | trim %}
          {% set label = {
            'open': 'Open for comfort ventilation',
            'open_briefly': 'Brief stale-air purge',
            'close': 'Close windows',
            'neutral': 'Neutral / no window change'
          }.get(rec, rec | title) %}
          {% set mode_label = {
            'comfort': 'Comfort ventilation',
            'winter_purge': 'Brief cold-weather airing',
            'brief_purge': 'Bounded stale-air purge'
          }.get(mode, mode | replace('_', ' ') | title) %}
          ## {{ label }}

          **Recommendation class:** {{ mode_label }}

          {% if rec == 'open_briefly' %}
          **This is not ordinary comfort ventilation.** Open briefly only for
          the bounded stale-air purge, then close windows after 5-10 minutes.
          {% elif rec == 'open' %}
          **Comfort ventilation:** outdoor comfort and moisture conditions are
          favorable enough for normal window opening.
          {% elif rec == 'close' %}
          **Close path:** rain, HVAC, humidity, or comfort checks are against
          open windows.
          {% else %}
          **Neutral path:** no active open, close, or brief-purge recommendation.
          {% endif %}

          {{ states('sensor.window_ventilation_reason') }}

          _This is advisory-only. It does not confirm individual window-contact
          state or change HVAC behavior._

      - type: conditional
        conditions:
          - entity: sensor.window_ventilation_recommendation
            state: "open_briefly"
        card:
          type: markdown
          title: "Brief purge guardrails"
          content: >-
            This compromise state is a short stale-air purge, not a comfort
            ventilation recommendation. It only appears when indoor air is poor
            and worsening, rain/HVAC suppression is clear, and outdoor
            temperature/dew point are within the brief-purge bounds. Close
            windows after 5-10 minutes.

      - type: entities
        title: "Advisor status"
        show_header_toggle: false
        entities:
          - entity: input_boolean.window_ventilation_advisor_enabled
            name: "Advisor notifications enabled"
          - entity: sensor.window_ventilation_recommendation
            name: "Recommendation state"
          - entity: sensor.window_ventilation_reason
            name: "Reason"
          - type: attribute
            entity: sensor.window_ventilation_recommendation
            attribute: mode
            name: "Recommendation class"
          - entity: binary_sensor.window_ventilation_favorable
            name: "Comfort ventilation favorable"
          - entity: binary_sensor.window_ventilation_unfavorable
            name: "Unfavorable / close windows"
          - entity: binary_sensor.window_ventilation_brief_purge
            name: "Bounded stale-air purge active"

      - type: entities
        title: "Comfort and dew point context"
        show_header_toggle: false
        entities:
          - entity: sensor.dining_room_thermostat_temperature
            name: "Indoor temperature"
          - entity: sensor.thermostat_humidity
            name: "Indoor humidity"
          - entity: sensor.window_ventilation_indoor_dew_point
            name: "Indoor dew point"
          - entity: sensor.weather_outdoor_temperature
            name: "Outdoor temperature"
          - entity: sensor.weather_outdoor_humidity
            name: "Outdoor humidity"
          - entity: sensor.weather_outdoor_dew_point
            name: "Outdoor dew point"

      - type: entities
        title: "Rain and HVAC context"
        show_header_toggle: false
        entities:
          - entity: sensor.precipitation_forecast_next_hour
            name: "Rain probability next hour"
          - entity: sensor.condition_forecast_next_hour
            name: "Next-hour condition"
          - entity: climate.dining_room_thermostat
            name: "Thermostat"
          - type: attribute
            entity: climate.dining_room_thermostat
            attribute: hvac_action
            name: "HVAC action"
          - type: attribute
            entity: climate.dining_room_thermostat
            attribute: hvac_mode
            name: "HVAC mode"

      - type: entities
        title: "Air quality current vs baseline"
        show_header_toggle: false
        entities:
          - entity: sensor.thermostat_carbon_dioxide
            name: "CO2 current"
          - entity: sensor.window_ventilation_co2_baseline
            name: "CO2 24h baseline"
          - entity: sensor.thermostat_vocs
            name: "VOC current"
          - entity: sensor.window_ventilation_voc_baseline
            name: "VOC 24h baseline"

      - type: entities
        title: "Tuning helpers"
        show_header_toggle: false
        entities:
          - entity: input_number.window_ventilation_cooler_delta
            name: "Required cooler delta"
          - entity: input_number.window_ventilation_max_outdoor_dew_point
            name: "Max outdoor dew point"
          - entity: input_number.window_ventilation_brief_purge_max_outdoor_temperature_delta
            name: "Brief purge max warmer delta"
          - entity: input_number.window_ventilation_brief_purge_max_outdoor_dew_point
            name: "Brief purge max outdoor dew point"
          - entity: input_number.window_ventilation_winter_threshold
            name: "Winter purge threshold"
          - entity: input_number.window_ventilation_high_indoor_humidity
            name: "High indoor humidity threshold"
